# Pipeline entry point - see documentation/CI-SETUP.md for the full explanation of this
# structure and the one-time GitLab project-settings steps it depends on.

stages:
  - lint
  - build
  - test
  - deploy
  - verify

variables:
  SOLUTION: "GauntletAI.AgentForge.slnx"
  BUILD_CONFIG: "Release"
  UNIT_TEST_PATTERN: "*UnitTests.csproj"
  INTEGRATION_TEST_PATTERN: "*IntegrationTests.csproj"
  # Default shallow-clone depth (project setting) is 20 - too shallow once a long-lived
  # branch (e.g. staging) diverges further back than that. A too-shallow merge-base lookup
  # in before_script below makes git report "refusing to merge unrelated histories" for a
  # merge-base that genuinely exists, just outside the fetched window - see the deploy job,
  # which deliberately overrides this back down to 1 since it never runs the MR before_script.
  GIT_DEPTH: "1000"

default:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  interruptible: true

# Deliberately no catch-all "$CI_COMMIT_BRANCH" rule (GitLab issue #40): every feature/fix branch in
# this repo's workflow gets an MR opened right after its first push, so a bare branch-push rule ran
# a full pipeline on the raw branch ref and then a *second*, separate one once the MR pipeline
# (merge_request_event) kicked in - the same commits tested twice on every change. The MR pipeline
# is strictly more informative anyway: it tests the actual merge against the target branch, not a
# stale snapshot (see before_script below). One consequence worth knowing: `develop` no longer gets
# its own pipeline immediately after each feature MR merges into it - only `main` (the default
# branch) triggers on a bare push. `develop`'s state is still verified twice over: once by the
# feature MR's own pipeline before it merges, and again by the develop -> main MR's pipeline when
# that promotion happens.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Every MR pipeline tests "your changes + current target branch", not a stale snapshot -
# a real conflict with the target branch fails the pipeline immediately instead of
# producing a green run that can't actually merge cleanly.
before_script:
  - |
    if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
      # --depth on this specific fetch deepens the target branch regardless of GIT_DEPTH's
      # effect (or lack thereof) on a manual fetch of a *different* ref than the one checked
      # out - belt-and-suspenders alongside the GIT_DEPTH bump above.
      git fetch --depth=1000 origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      git -c user.email="ci@local" -c user.name="CI" merge --no-edit "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" || {
        echo "Merge conflict with $CI_MERGE_REQUEST_TARGET_BRANCH_NAME - resolve locally and re-push.";
        exit 1;
      }
    fi

include:
  - local: ".gitlab/ci/lint.yml"
  - local: ".gitlab/ci/build.yml"
  - local: ".gitlab/ci/test.yml"
  - local: ".gitlab/ci/deploy.yml"
  - local: ".gitlab/ci/verify.yml"
