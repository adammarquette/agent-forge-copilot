# =============================================================================
# Agent Forge Copilot — CI/CD (pipeline root)
#
# GitLab auto-discovers this file at the repo root — no project setting needed,
# so the entire pipeline (location included) is defined as code.
#
# This root file is the orchestration layer: workflow rules, stages, shared
# defaults, and variables. The actual jobs live in per-stage fragments under
# .gitlab/ci/, pulled in via `include` below:
#   .gitlab/ci/build.yml   — build stage
#   .gitlab/ci/test.yml    — unit + integration test stage
#   .gitlab/ci/deploy.yml  — manual deploy gate (main only)
#
# Behavior:
#   * Merge requests  -> build + unit tests + integration tests must pass.
#                        Every push to the MR branch re-runs the pipeline.
#                        Each job first merges the current target branch (main)
#                        into the MR head, so tests always run against
#                        "my changes + latest main", even on GitLab Free.
#   * main (default)  -> after an MR merges, main runs the full test suite.
#                        The deploy job only becomes runnable (manual gate)
#                        when every test stage on main is green.
#
# Pair this with the project settings in CI-SETUP.md — most importantly
# "Pipelines must succeed" under Settings > Merge requests.
# =============================================================================

include:
  - local: '.gitlab/ci/build.yml'
  - local: '.gitlab/ci/test.yml'
  - local: '.gitlab/ci/deploy.yml'

workflow:
  rules:
    # Run a pipeline for merge requests...
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # ...and for pushes to the default branch (post-merge verification).
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # Everything else (pushes to feature branches with no open MR) is skipped
    # to avoid duplicate branch+MR pipelines.

stages:
  - build
  - test
  - deploy

default:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  interruptible: true          # let newer pushes auto-cancel stale runs
  before_script:
    # --- "Merged results" on any GitLab tier -------------------------------
    # For MR pipelines, merge the latest target branch (main) into the MR
    # head before doing anything. If main moved since the MR was opened,
    # tests run against the combined result; a conflict fails fast here.
    # (If your instance has Premium "merged results pipelines" enabled this
    # is a harmless no-op — the checkout already contains the target.)
    - |
      if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
        git config user.email "ci@labs.gauntletai.com"
        git config user.name  "GitLab CI"
        git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        git merge --no-edit "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" \
          || { echo "❌ Merge conflict with $CI_MERGE_REQUEST_TARGET_BRANCH_NAME — rebase your branch."; exit 1; }
      fi

variables:
  # ---- Adjust these three to match the repo layout -------------------------
  SOLUTION: ""                                   # e.g. "AgentForgeCopilot.sln"; empty = auto-detect single .sln/.csproj at root
  UNIT_TEST_PATTERN: "*UnitTests.csproj"         # glob matched with `find -name`
  INTEGRATION_TEST_PATTERN: "*IntegrationTests.csproj"
  # ---------------------------------------------------------------------------
  BUILD_CONFIG: "Release"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

# Cache restored NuGet packages between pipelines.
cache:
  key: "nuget-$CI_DEFAULT_BRANCH"
  paths:
    - .nuget/packages/
