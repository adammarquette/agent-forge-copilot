# .harness.conf — what the doc gates read. See scripts/check-doc-sizes.sh.
#
# Only the size gate is installed in this repo. The link gate runs from the agent-harness skill on demand,
# and the requirement gate is not installed: requirement ids here live in two files with two shapes
# (PRD.md's FR-*/NFR-*, USERS.md's UC-*), which the single-source gate does not model. Leaving
# REQUIREMENT_SOURCE empty makes that gate say so out loud instead of skipping quietly, if anyone installs it.

# The price unit. Bytes / BYTES_PER_TOKEN, rounded to ROUNDING_STEP tokens, written to 0.1K.
BYTES_PER_TOKEN=4
ROUNDING_STEP=100

# Tables whose `~tok` column is checked, as "<file>|<heading>".
#
# ADDING OR REMOVING AN ENTRY IS A DELIBERATE ACT. Removing one stops its rows being measured and nothing
# else in the repository will notice. These three are the routing surfaces — the tables a reader uses to
# decide what to open — which is exactly where a wrong price sends someone the wrong way.
PRICED_TABLES=(
  "documentation/INDEX.md|## 1. Documents catalog (the sources)"
  "documentation/agents/README.md|## The contracts"
  "AGENTS.md|## Routing — find your contract, then open it"
  "README.md|### Documentation index (suggested read order)"
)

# Not used here — see the note at the top.
REQUIREMENT_SOURCE=""
REQUIREMENT_ID_REGEX='\bFR-[A-Z]+-[0-9]+'
REQUIREMENT_DEF_PATTERNS=()
REQUIREMENT_EXCLUDE_PATHS=(
  'scripts/*-selftest.sh'
)
