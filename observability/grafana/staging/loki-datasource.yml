# Staging datasource override: points Grafana at the private Loki service (agentforge-loki) over
# Railway's internal network. The local-compose provisioning file
# (../provisioning/datasources/loki.yml) keeps http://loki:3100; this file replaces it in the
# staging image only - same pattern as staging/datasource.yml for Prometheus.
# reference: documentation/DEPLOYMENT_TOPOLOGY.md, gitlab#107
apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://agentforge-loki.railway.internal:3100
    editable: false
