# Datasource override for the deployed image: points Grafana at the Loki container by service name on
# the private network. The local-compose provisioning file (../provisioning/datasources/loki.yml) keeps
# http://loki:3100; this file replaces it in the deployed image only - same pattern as
# deployed/datasource.yml for Prometheus.
# reference: documentation/DEPLOYMENT_TOPOLOGY.md, gitlab#107
apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://agentforge-loki:3100
    editable: false
