# Datasource override for the deployed image: points Grafana at the Prometheus container by service
# name on the private network. The local-compose provisioning file
# (../provisioning/datasources/prometheus.yml) keeps http://prometheus:9090; this file replaces it in
# the deployed image only.
# reference: documentation/DEPLOYMENT.md, gitlab#57
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://agentforge-prometheus:9090
    isDefault: true
    editable: false
