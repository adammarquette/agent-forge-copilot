# Local-compose Loki datasource (Epic 107): Grafana reads sidecar logs from the Loki container.
# The deployed image replaces this url with the container service address (../deployed/loki-datasource.yml).
apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
