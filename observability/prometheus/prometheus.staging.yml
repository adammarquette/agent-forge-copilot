# Staging scrape config: Prometheus deployed alongside the sidecar on Railway
# (project lucid-clarity, staging env). Unlike prometheus.yml (local dotnet run via
# host.docker.internal:5113), this target is the sidecar's Railway private-network
# address — reachable only inside the project, never public.
# reference: documentation/RAILWAY.md, gitlab#57
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/agentforge-alerts.yml

scrape_configs:
  - job_name: agentforge-api
    metrics_path: /metrics
    static_configs:
      - targets: ["agent-forge-api-staging.railway.internal:8080"]
