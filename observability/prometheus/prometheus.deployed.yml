# Scrape config for a DEPLOYED sidecar: Prometheus running as a container alongside the
# agent-forge-api container, reaching it by service name on the private container network.
# (prometheus.yml, used by observability/docker-compose.yml, instead scrapes a `dotnet run`
# sidecar on the host via host.docker.internal:5113.) Adjust the target to the sidecar's
# service name in whatever stack this is deployed into.
# reference: documentation/DEPLOYMENT.md, gitlab#57
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/agentforge-alerts.yml

scrape_configs:
  - job_name: agentforge-api
    metrics_path: /metrics
    static_configs:
      - targets: ["agent-forge-api:8080"]
