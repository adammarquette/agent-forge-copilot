# Scrape config for the AgentForge sidecar's own OTel Prometheus exporter (/metrics, wired in
# Program.cs). Default target is the sidecar running locally via `dotnet run`
# (src/MarqSpec.AgentForge.Api/Properties/launchSettings.json's fixed HTTP port, 5113). Pointing
# this at the sidecar CONTAINER instead is a one-line edit to the target below (see prometheus.deployed.yml).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/agentforge-alerts.yml

scrape_configs:
  - job_name: agentforge-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5113"]
