# -----------------------------------------------------------------------------
# LINT stage (reverse-proxy) — validates reverse-proxy/nginx.conf.template's
# syntax without needing real upstream hosts or a deployed environment. Runs
# unconditionally (every MR/push) since it's cheap and needs no secrets - unlike
# the deploy/verify jobs below, which need the not-yet-created environment.
#
# `nginx -t` only checks the *rendered* config, so the template's ${VAR}
# placeholders are substituted with the Dockerfile's own placeholder defaults
# first (envsubst, the same mechanism nginx's docker-entrypoint uses at
# container start) - this job never needs the real Railway upstream hostnames.
# -----------------------------------------------------------------------------

nginx-config-lint:
  stage: lint
  image: nginx:1.27-alpine
  interruptible: true
  variables:
    GIT_STRATEGY: fetch
    OPENEMR_UPSTREAM: "openemr.railway.internal:80"
    SIDECAR_UPSTREAM: "agent-forge-api.railway.internal:8080"
    DNS_RESOLVER: "127.0.0.11"
    PORT: "8080"
  script:
    - envsubst '${PORT} ${OPENEMR_UPSTREAM} ${SIDECAR_UPSTREAM} ${DNS_RESOLVER}' < reverse-proxy/nginx.conf.template > /etc/nginx/conf.d/default.conf
    - nginx -t
