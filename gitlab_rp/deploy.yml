# -----------------------------------------------------------------------------
# DEPLOY stage (reverse-proxy) — Railway deployment of reverse-proxy/'s nginx
# front door, via `railway up`.
#
# Manual and separate from the main deploy job (`.gitlab/ci/deploy.yml`) on
# purpose: per agent-forge-copilot#62, this deploys to a SEPARATE Railway
# environment first (not "staging", where the current OpenEMR + sidecar
# deployment lives) - the existing deployment stays untouched until the full
# launch round-trip and a full OpenEMR regression pass (agent-forge#28, #29)
# are verified against this one. Once that's confirmed, traffic cuts over;
# this job is not meant to run unattended on every merge to main until then.
#
# One-time setup needed before this job can run (none of this exists yet):
#   1. Create the target Railway environment (e.g. "reverse-proxy") with
#      sibling OpenEMR + sidecar services reachable over private networking.
#   2. Set reverse-proxy/Dockerfile's OPENEMR_UPSTREAM/SIDECAR_UPSTREAM to
#      those services' real <service-name>.railway.internal hostnames.
#   3. Create a Railway project token scoped to that environment (Project
#      Settings > Tokens) and add it as RAILWAY_TOKEN_RP (masked, protected)
#      in GitLab CI/CD variables - same pattern as RAILWAY_TOKEN_STAGING.
#   4. Point RAILWAY_SERVICE_RP / DEPLOYED_FRONT_DOOR_URL (below, and in
#      verify.yml) at the real service name and public URL once known.
# -----------------------------------------------------------------------------

nginx-deploy:
  stage: deploy
  image:
    name: ghcr.io/railwayapp/cli:latest
    entrypoint: [""]
  interruptible: false
  variables:
    GIT_DEPTH: "1"
    RAILWAY_SERVICE_RP: "agent-forge-reverse-proxy"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  environment:
    name: reverse-proxy
  before_script:
    - railway --version
  script:
    - export RAILWAY_TOKEN="$RAILWAY_TOKEN_RP"
    - railway up reverse-proxy --service "$RAILWAY_SERVICE_RP" --ci
