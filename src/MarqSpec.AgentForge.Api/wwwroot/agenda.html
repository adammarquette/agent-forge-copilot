<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily Agenda · AgentForge Clinical Copilot</title>
  <style>
    :root {
      --bg: #f6f8fa; --surface: #ffffff; --border: #e3e8ee; --text: #1b2733;
      --muted: #5a6b7b; --accent: #1a6fb5; --accent-weak: #eaf3fb;
      --flag-bg: #fff4e5; --flag-text: #8a5300; --fail-bg: #fdecea; --fail-text: #9b2c22;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f151b; --surface: #182430; --border: #2a3a48; --text: #e6edf3;
        --muted: #93a4b3; --accent: #4aa3e0; --accent-weak: #14263a;
        --flag-bg: #3a2c14; --flag-text: #f0c079; --fail-bg: #3a1f1c; --fail-text: #f0a79c;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
    header.page { display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
      flex-wrap: wrap; margin-bottom: 20px; }
    h1 { font-size: 22px; margin: 0; }
    .asof { color: var(--muted); font-size: 13px; }
    .rows { display: flex; flex-direction: column; gap: 10px; }
    .row { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 16px; cursor: pointer; color: inherit; font: inherit;
      display: grid; grid-template-columns: 68px 1fr; gap: 4px 14px; align-items: start; }
    .row:hover, .row:focus-visible { border-color: var(--accent); background: var(--accent-weak); outline: none; }
    .row .time { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--accent); grid-row: 1 / span 2; }
    .row .name { font-weight: 600; }
    .row .summary { color: var(--muted); font-size: 14px; }
    .flags { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .flag { background: var(--flag-bg); color: var(--flag-text); border-radius: 999px;
      padding: 2px 10px; font-size: 12.5px; font-weight: 600; }
    .failed { grid-column: 2; background: var(--fail-bg); color: var(--fail-text);
      border-radius: 8px; padding: 6px 10px; font-size: 13px; margin-top: 4px; }
    .state { text-align: center; padding: 56px 20px; color: var(--muted); }
    .state .glyph { width: 56px; height: 56px; margin: 0 auto 14px; color: var(--accent); opacity: .85; }
    .state h2 { color: var(--text); font-size: 18px; margin: 0 0 6px; }
    .state p { margin: 0 auto; max-width: 42ch; }
    .state button { margin-top: 18px; background: var(--accent); color: #fff; border: 0; border-radius: 8px;
      padding: 9px 18px; font: inherit; font-weight: 600; cursor: pointer; }
    .spinner { width: 34px; height: 34px; border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; margin: 0 auto; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .banner { background: var(--flag-bg); color: var(--flag-text); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 14px; font-weight: 600; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="page">
      <h1>Daily Agenda</h1>
      <span class="asof" id="asof"></span>
    </header>

    <div id="drill-warning" class="banner" hidden>
      Couldn’t open the patient view. Please reload the Daily Agenda and try again.
    </div>

    <div id="loading" class="state">
      <div class="spinner" aria-hidden="true"></div>
      <p style="margin-top:14px">Loading today’s agenda…</p>
    </div>

    <div id="empty" class="state" hidden>
      <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4.5" width="18" height="16" rx="2" /><path d="M3 9h18M8 2.5v4M16 2.5v4" />
        <path d="M8.5 15.5l2 2 4-4" />
      </svg>
      <h2>No patients on today’s schedule</h2>
      <p>There are no remaining appointments on the calendar right now. New arrivals will appear here automatically.</p>
      <button type="button" id="empty-refresh">Refresh</button>
    </div>

    <div id="error" class="state" hidden>
      <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9" /><path d="M12 8v5M12 16.5h.01" />
      </svg>
      <h2 id="error-title">Couldn’t load the agenda</h2>
      <p id="error-msg"></p>
      <button type="button" id="error-refresh">Try again</button>
    </div>

    <div id="rows" class="rows" hidden></div>
  </div>

  <script>
    (function () {
      var el = function (id) { return document.getElementById(id); };
      function show(which) {
        ['loading', 'empty', 'error', 'rows'].forEach(function (k) { el(k).hidden = (k !== which); });
      }
      function fmtTime(iso) {
        try { return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
        catch (e) { return ''; }
      }
      function selectPatient(patientId, displayName) {
        // Drill into one patient via a PATIENT-scoped launch through OpenEMR, not by reusing the
        // roster's user-scoped token: the per-patient brief reads Encounter/DiagnosticReport/
        // DocumentReference, which OpenEMR forbids (403) under a user scope but allows under a
        // patient-bound token (gitlab#76). Root-relative /interface/... hits OpenEMR through the
        // same-origin reverse-proxy front door.
        var url = '/interface/modules/custom_modules/oe-module-agentforge/public/agenda-drilldown-launch.php?patient='
          + encodeURIComponent(patientId);
        el('drill-warning').hidden = true;
        // Open the patient in a real OpenEMR application tab (like Calendar/Message Center) -
        // not a modal, not a browser tab - via the tab framework's navigateTab/activateTabByName
        // (interface/main/tabs/js/tabs_view_model.js). This page runs in OpenEMR's agenda tab
        // iframe, same-origin via the reverse-proxy front door, so it reaches those on window.top
        // (the same access the old dlgopen modal used). navigateTab creates the tab on first use
        // and re-navigates + refocuses it on later clicks. One shared "AgentForge" patient tab
        // (name 'agfpat', distinct from the agenda's 'agf') that re-navigates to whichever patient
        // is clicked - mirrors OpenEMR's single-patient-chart model and keeps the Daily Agenda tab
        // open alongside it. The SMART patient-scoped re-launch completes in the tab's iframe
        // same-origin, no SameSite bridge-cookie dance. reference: gitlab#79
        var loadingLabel = displayName || ('Patient ' + patientId);
        try {
          var top = window.top;
          if (top && typeof top.navigateTab === 'function') {
            top.navigateTab(url, 'agfpat', function () {
              if (typeof top.activateTabByName === 'function') {
                top.activateTabByName('agfpat', true);
              }
            }, loadingLabel);
            return;
          }
        } catch (e) { /* cross-origin/unavailable top frame - fall through to the notice below */ }
        el('drill-warning').hidden = false;
      }
      function render(data) {
        var rows = (data && data.rows) || [];
        el('asof').textContent = data && data.asOf ? 'As of ' + fmtTime(data.asOf) : '';
        if (rows.length === 0) { show('empty'); return; }
        var container = el('rows');
        container.innerHTML = '';
        rows.forEach(function (r) {
          var btn = document.createElement('button');
          btn.className = 'row';
          btn.type = 'button';
          var time = document.createElement('div'); time.className = 'time'; time.textContent = fmtTime(r.scheduledStart);
          var name = document.createElement('div'); name.className = 'name';
          name.textContent = r.displayName || ('Patient ' + r.patientId);
          name.title = 'Patient ' + r.patientId; // uuid on hover; drill-down still selects by id
          btn.appendChild(time); btn.appendChild(name);
          if (r.failed) {
            var fail = document.createElement('div'); fail.className = 'failed';
            fail.textContent = r.failureReason || 'Summary unavailable for this patient.';
            btn.appendChild(fail);
          } else if (r.summary) {
            var sum = document.createElement('div'); sum.className = 'summary'; sum.textContent = r.summary;
            btn.appendChild(sum);
          }
          if (r.safetyFlags && r.safetyFlags.length) {
            var flags = document.createElement('div'); flags.className = 'flags';
            r.safetyFlags.forEach(function (fl) {
              var chip = document.createElement('span'); chip.className = 'flag';
              chip.textContent = fl.description || fl.ruleId; chip.title = fl.ruleId;
              flags.appendChild(chip);
            });
            btn.appendChild(flags);
          }
          btn.addEventListener('click', function () { selectPatient(r.patientId, r.displayName); });
          container.appendChild(btn);
        });
        show('rows');
      }
      function fail(title, msg) { el('error-title').textContent = title; el('error-msg').textContent = msg; show('error'); }
      function load() {
        show('loading');
        fetch('agenda', { headers: { 'Accept': 'application/json' }, credentials: 'same-origin' })
          .then(function (res) {
            if (res.status === 401) { fail('Session expired', 'Please re-launch the Daily Agenda from OpenEMR to sign back in.'); return null; }
            if (!res.ok) { fail('Couldn’t load the agenda', 'The server returned an unexpected response (' + res.status + '). Please try again.'); return null; }
            return res.json();
          })
          .then(function (data) { if (data) render(data); })
          .catch(function () { fail('Connection problem', 'Couldn’t reach the agenda service. Check your connection and try again.'); });
      }
      el('empty-refresh').addEventListener('click', load);
      el('error-refresh').addEventListener('click', load);
      load();
    })();
  </script>
</body>
</html>
