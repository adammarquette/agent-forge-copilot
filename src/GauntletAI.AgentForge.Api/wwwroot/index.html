<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AgentForge Clinical Co-Pilot</title>
  <style>
    :root {
      --bg: #f6f8fa; --surface: #ffffff; --border: #e3e8ee; --text: #1b2733;
      --muted: #5a6b7b; --accent: #1a6fb5; --accent-weak: #eaf3fb;
      --user-bg: #1a6fb5; --user-text: #ffffff;
      --ok: #1a7f4b; --warn-bg: #fff4e5; --warn-text: #8a5300;
      --fail-bg: #fdecea; --fail-text: #9b2c22; --cite-bg: #eef2f6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f151b; --surface: #182430; --border: #2a3a48; --text: #e6edf3;
        --muted: #93a4b3; --accent: #4aa3e0; --accent-weak: #14263a;
        --user-bg: #2b6fa5; --user-text: #ffffff;
        --ok: #5fce93; --warn-bg: #3a2c14; --warn-text: #f0c079;
        --fail-bg: #3a1f1c; --fail-text: #f0a79c; --cite-bg: #1d2b38;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .app { display: flex; flex-direction: column; height: 100%; max-width: 820px; margin: 0 auto; }
    header.bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      border-bottom: 1px solid var(--border); background: var(--surface); }
    header.bar .who { min-width: 0; }
    header.bar .name { font-weight: 650; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    header.bar .demo { color: var(--muted); font-size: 12.5px; }
    header.bar .status { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
    .dot.on { background: var(--ok); } .dot.off { background: var(--fail-text); } .dot.wait { background: var(--warn-text); }
    .scroll { flex: 1; overflow-y: auto; padding: 18px 16px; }
    .msg { display: flex; margin-bottom: 16px; }
    .msg.user { justify-content: flex-end; }
    .bubble { max-width: 88%; border-radius: 14px; padding: 11px 14px; }
    .msg.user .bubble { background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 4px; }
    .msg.bot .bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .answer { white-space: pre-wrap; word-wrap: break-word; }
    .cite-key { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
    .cite-key .h { font-weight: 600; margin-bottom: 4px; color: var(--text); }
    .cite-key .item { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; line-height: 1.7; word-break: break-all; }
    .banner { border-radius: 8px; padding: 8px 11px; font-size: 13px; margin-bottom: 8px; }
    .banner.fallback { background: var(--warn-bg); color: var(--warn-text); }
    .flags { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
    .flag { background: var(--fail-bg); color: var(--fail-text); border-radius: 8px; padding: 7px 10px; font-size: 13px; }
    .flag .cites { display: block; margin-top: 3px; opacity: .85; font-size: 12px; }
    .cite { display: inline-block; background: var(--cite-bg); color: var(--muted); border-radius: 5px;
      padding: 0 6px; margin: 2px 4px 0 0; font-size: 11.5px; font-variant-numeric: tabular-nums; }
    .suppressed { margin-top: 10px; font-size: 12.5px; color: var(--muted); }
    .suppressed summary { cursor: pointer; color: var(--warn-text); }
    .suppressed li { margin-top: 4px; }
    .think { display: inline-flex; gap: 5px; align-items: center; color: var(--muted); }
    .think .d { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite both; }
    .think .d:nth-child(2){ animation-delay:.2s } .think .d:nth-child(3){ animation-delay:.4s }
    .think .think-status { font-size: 13px; }
    .think .think-status:empty { display: none; }
    @keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }
    form.composer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--surface); }
    textarea { flex: 1; resize: none; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
      font: inherit; background: var(--bg); color: var(--text); max-height: 140px; }
    textarea:focus { outline: none; border-color: var(--accent); }
    button.send { border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-weight: 600;
      padding: 0 16px; cursor: pointer; }
    button.send:disabled { opacity: .5; cursor: default; }
    .hint { text-align: center; color: var(--muted); font-size: 12px; padding: 0 16px 10px; }
    .state { text-align: center; padding: 56px 20px; color: var(--muted); margin: auto; }
    .state .glyph { width: 52px; height: 52px; margin: 0 auto 14px; color: var(--accent); opacity: .85; }
    .state h2 { color: var(--text); font-size: 18px; margin: 0 0 6px; }
    .state button { margin-top: 16px; background: var(--accent); color:#fff; border:0; border-radius:8px; padding:9px 18px; font:inherit; font-weight:600; cursor:pointer; }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; margin: 0 auto; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Tagged sources list + click-to-source (#120) */
    .src-item { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; line-height: 1.5; }
    .src-item .n { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
    .src-badge { flex: none; font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 4px;
      border: 1px solid var(--border); color: var(--muted); background: var(--cite-bg); white-space: nowrap; }
    .src-badge.doc { color: var(--accent); border-color: var(--accent); background: var(--accent-weak); }
    .src-item .lbl { min-width: 0; word-break: break-word; color: var(--text); }
    button.src-open { border: 0; background: none; padding: 0; margin: 0; font: inherit; color: var(--accent);
      text-align: left; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; min-width: 0; word-break: break-word; }
    button.src-open:hover { opacity: .8; }
    .src-note { flex: none; color: var(--muted); font-size: 11px; }
    .answer .cite-ref { border: 0; background: none; padding: 0; margin: 0; font: inherit; color: var(--accent); cursor: pointer; vertical-align: baseline; }
    .answer .cite-ref:hover { text-decoration: underline; }
    .src-item.cite-flash { animation: citeflash 1.1s ease; border-radius: 6px; }
    @keyframes citeflash { 0%, 100% { background: transparent; } 25% { background: var(--accent-weak); } }
    .src-subhead { font-size: 11px; font-weight: 600; color: var(--text); margin: 8px 0 2px; }
    #docOverlay { position: fixed; inset: 0; background: rgba(8,14,20,.55); display: flex; align-items: center;
      justify-content: center; padding: 20px; z-index: 50; }
    #docOverlay .sheet { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      width: min(900px, 100%); max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; }
    #docOverlay .sheet-bar { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--border); }
    #docOverlay .sheet-bar .t { flex: 1; min-width: 0; font-size: 13px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #docOverlay .sheet-bar button { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
    #docViewer { overflow: auto; padding: 14px; background: var(--bg); text-align: center; }
    #docViewer .page { position: relative; display: inline-block; margin: 0 auto 12px; box-shadow: 0 0 0 1px var(--border); }
    #docViewer .page canvas { display: block; max-width: 100%; height: auto; }
    #docViewer .box { position: absolute; border: 1px solid transparent; background: transparent; pointer-events: none;
      transition: background .25s, border-color .25s; }
    #docViewer .box.active { border-color: rgba(74,163,224,.6); background: rgba(74,163,224,.12); }
    #docViewer .box.flash { border-color: rgba(255,200,60,.95); background: rgba(255,200,60,.28); }
    #docViewer .vhint { color: var(--muted); font-size: 12px; padding: 20px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <div id="loading" class="state">
      <div class="spinner" aria-hidden="true"></div>
      <p style="margin-top:14px">Loading patient…</p>
    </div>

    <div id="expired" class="state" hidden>
      <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" />
      </svg>
      <h2>Session expired</h2>
      <p>Please re-launch AgentForge from the patient's chart in OpenEMR to sign back in.</p>
    </div>

    <div id="fatal" class="state" hidden>
      <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9" /><path d="M12 8v5M12 16.5h.01" />
      </svg>
      <h2 id="fatal-title">Couldn’t start the co-pilot</h2>
      <p id="fatal-msg"></p>
      <button type="button" id="fatal-retry">Try again</button>
    </div>

    <header class="bar" id="bar" hidden>
      <div class="who">
        <div class="name" id="p-name">Patient</div>
        <div class="demo" id="p-demo"></div>
      </div>
      <div class="status"><span class="dot" id="dot"></span><span id="status-text">connecting…</span></div>
    </header>

    <div class="scroll" id="scroll" hidden></div>

    <form class="composer" id="composer" hidden>
      <textarea id="input" rows="1" placeholder="Ask about this patient…" autocomplete="off"></textarea>
      <button type="submit" class="send" id="send" disabled>Send</button>
    </form>
    <div class="hint" id="hint" hidden>Answers are drawn only from this patient's record and cite their source.</div>
  </div>

  <div id="docOverlay" hidden>
    <div class="sheet">
      <div class="sheet-bar">
        <span class="t" id="doc-title">Source document</span>
        <button type="button" id="doc-close" aria-label="Close">&times;</button>
      </div>
      <div id="docViewer"><p class="vhint">Loading…</p></div>
    </div>
  </div>

  <script type="module">
    import * as pdfjsLib from './lib/pdfjs/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = './lib/pdfjs/pdf.worker.min.mjs';

    // Click-to-source overlay for the chat's document citations (FR-CITE-2, gitlab#120). Ported from
    // evidence.html: fetch the OpenEMR source document, render it, and highlight the cited region on demand.
    // Exposed on window so the (non-module) chat script can open it with a normalized citation.
    var overlay = document.getElementById('docOverlay');
    var viewer = document.getElementById('docViewer');
    var titleEl = document.getElementById('doc-title');
    var rendered = { key: null, wrappers: [] };
    var activeBox = null;

    function close() { overlay.hidden = true; }
    document.getElementById('doc-close').addEventListener('click', close);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !overlay.hidden) close(); });

    async function renderPdf(buffer) {
      viewer.innerHTML = '';
      var pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
      var wrappers = [];
      for (var n = 1; n <= pdf.numPages; n++) {
        var page = await pdf.getPage(n);
        var viewport = page.getViewport({ scale: 1.5 });
        var wrap = document.createElement('div'); wrap.className = 'page';
        var canvas = document.createElement('canvas');
        canvas.width = viewport.width; canvas.height = viewport.height;
        wrap.appendChild(canvas); viewer.appendChild(wrap);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        wrappers[n] = wrap;
      }
      return wrappers;
    }

    // Full-width row band at the citation's vertical position (PdfPig glyph rect), padded so it isn't tight.
    function drawBox(wrap, bbox) {
      var hRaw = bbox[3], pad = hRaw * 0.4;
      var y = Math.max(0, bbox[1] - pad), h = Math.min(1 - y, hRaw + pad * 2);
      var box = document.createElement('div'); box.className = 'box';
      box.style.left = '0'; box.style.top = (y * 100) + '%'; box.style.width = '100%'; box.style.height = (h * 100) + '%';
      wrap.appendChild(box); return box;
    }

    window.AgentForgeOverlay = {
      open: async function (c) {
        if (!c || !c.sourceDocumentId) return;
        titleEl.textContent = (c.field ? c.field + ' — ' : '') + 'source document';
        overlay.hidden = false;
        try {
          if (rendered.key !== c.sourceDocumentId || !rendered.wrappers.length) {
            viewer.innerHTML = '<p class="vhint">Loading source document…</p>';
            var resp = await fetch('evidence/document/' + encodeURIComponent(c.sourceDocumentId));
            if (!resp.ok) { viewer.innerHTML = '<p class="vhint">Could not load the source document (' + resp.status + ').</p>'; return; }
            rendered.wrappers = await renderPdf(await resp.arrayBuffer());
            rendered.key = c.sourceDocumentId; activeBox = null;
          }
          if (activeBox) { activeBox.classList.remove('active', 'flash'); activeBox = null; }
          var wrap = rendered.wrappers[c.page || 1];
          if (!wrap) return;
          if (Array.isArray(c.boundingBox) && c.boundingBox.length === 4) {
            var box = drawBox(wrap, c.boundingBox); box.classList.add('active', 'flash');
            setTimeout(function () { box.classList.remove('flash'); }, 1100);
            activeBox = box;
            // Scroll only the viewer (never the window/chat behind the modal) to center the region.
            var br = box.getBoundingClientRect(), vr = viewer.getBoundingClientRect();
            viewer.scrollTop += (br.top - vr.top) - (viewer.clientHeight / 2) + (br.height / 2);
          } else {
            viewer.scrollTop = 0; // page-level (no region): open at the top of the document
          }
        } catch (err) {
          viewer.innerHTML = '<p class="vhint">Error rendering document: ' + ((err && err.message) || err) + '</p>';
        }
      }
    };
  </script>
  <script src="lib/signalr.min.js"></script>
  <script>
    (function () {
      var el = function (id) { return document.getElementById(id); };
      function show(which) { ['loading','expired','fatal'].forEach(function(k){ el(k).hidden = (k!==which); }); }
      function showChat() {
        ['loading','expired','fatal'].forEach(function(k){ el(k).hidden = true; });
        el('bar').hidden = false; el('scroll').hidden = false; el('composer').hidden = false; el('hint').hidden = false;
      }
      function fatal(title, msg) { el('fatal-title').textContent = title; el('fatal-msg').textContent = msg; show('fatal'); }
      // Payloads arrive PascalCase (server serializes with default STJ); tolerate camelCase too.
      function pick(o, name) {
        if (o == null) return undefined;
        if (name in o) return o[name];
        var c = name.charAt(0).toLowerCase() + name.slice(1);
        return o[c];
      }

      var conn = null, lastSeq = 0, briefRequested = false, busy = false, seen = {};

      // ---- patient header ----
      function ageFrom(iso) {
        if (!iso) return null;
        var b = new Date(iso + 'T00:00:00'); if (isNaN(b.getTime())) return null;
        var n = new Date(), a = n.getFullYear() - b.getFullYear();
        if (n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) a--;
        return (a >= 0 && a < 150) ? a : null;
      }
      function loadPatient() {
        return fetch('patient', { headers: { 'Accept': 'application/json' }, credentials: 'same-origin' })
          .then(function (res) {
            if (res.status === 401) { show('expired'); return null; }
            if (!res.ok) throw new Error('patient ' + res.status);
            return res.json();
          })
          .then(function (d) {
            if (!d) return null;
            el('p-name').textContent = d.displayName || ('Patient ' + d.patientId);
            var parts = [];
            if (d.birthDate) { var age = ageFrom(d.birthDate); parts.push('DOB ' + d.birthDate + (age !== null ? ' · ' + age + 'y' : '')); }
            if (d.gender) parts.push(d.gender.charAt(0).toUpperCase() + d.gender.slice(1));
            el('p-demo').textContent = parts.join('  ·  ');
            return d;
          });
      }

      // ---- rendering ----
      function setStatus(cls, text) { el('dot').className = 'dot ' + cls; el('status-text').textContent = text; }
      function scrollDown() { var s = el('scroll'); s.scrollTop = s.scrollHeight; }

      function addUser(text) {
        var m = document.createElement('div'); m.className = 'msg user';
        var b = document.createElement('div'); b.className = 'bubble';
        var a = document.createElement('div'); a.className = 'answer'; a.textContent = text;
        b.appendChild(a); m.appendChild(b); el('scroll').appendChild(m); scrollDown();
      }
      function addThinking() {
        var m = document.createElement('div'); m.className = 'msg bot'; m.id = 'thinking';
        var b = document.createElement('div'); b.className = 'bubble';
        var t = document.createElement('div'); t.className = 'think';
        t.innerHTML = '<span class="think-status" id="think-status"></span><span class="d"></span><span class="d"></span><span class="d"></span>';
        b.appendChild(t); m.appendChild(b); el('scroll').appendChild(m); scrollDown();
      }
      function clearThinking() { var t = el('thinking'); if (t) t.remove(); }
      // Interim tool-call status from the server (ChatStatus) — perceived-latency only; the verified answer
      // still arrives as a normal ChatMessage that clears this bubble.
      function updateThinking(status) { var s = el('think-status'); if (s) s.textContent = status || ''; }

      // Replace inline source tokens like [MedicationRequest/abc-123] or [Lab/INR] with sequential [1], [2], …
      // and return the ordered source list for a "Sources" key. Repeated sources reuse their first number; the
      // underlying citation contract in the answer text is unchanged, this is display-only.
      function numberCitations(text) {
        var order = [], index = {};
        var out = String(text).replace(/\[([A-Za-z][\w.-]*\/[^\]]+)\]/g, function (_m, inner) {
          if (!Object.prototype.hasOwnProperty.call(index, inner)) { index[inner] = order.length + 1; order.push(inner); }
          return '[' + index[inner] + ']';
        });
        return { text: out, sources: order };
      }

      // Match a [Document/<slug>] source's id to its click-to-source citation (DocumentCitation.FactId slug).
      function findDocCitation(docCitations, id) {
        for (var k = 0; k < docCitations.length; k++) {
          if (String(pick(docCitations[k], 'FactId')) === id) return docCitations[k];
        }
        return null;
      }

      // One numbered source, tagged by kind: an openable Source document (click -> overlay), Guideline
      // evidence, or a plain OpenEMR record (no document to open).
      function renderSource(n, src, docCitations) {
        var slash = src.indexOf('/');
        var type = slash > 0 ? src.slice(0, slash) : src;
        var id = slash > 0 ? src.slice(slash + 1) : '';
        var dc = (type === 'Document') ? findDocCitation(docCitations, id) : null;

        var item = document.createElement('div'); item.className = 'src-item';
        var num = document.createElement('span'); num.className = 'n'; num.textContent = '[' + n + ']'; item.appendChild(num);

        var badge = document.createElement('span'); badge.className = 'src-badge';
        if (dc) { badge.className += ' doc'; badge.textContent = 'Source document'; }
        else if (type === 'Guideline') { badge.textContent = 'Guideline'; }
        else { badge.textContent = 'In the record'; }
        item.appendChild(badge);

        var action;
        if (dc) {
          var normalized = {
            sourceDocumentId: pick(dc, 'SourceDocumentId'), field: pick(dc, 'Field'),
            value: pick(dc, 'Value'), page: pick(dc, 'Page'), boundingBox: pick(dc, 'BoundingBox'),
          };
          action = function () { if (window.AgentForgeOverlay) window.AgentForgeOverlay.open(normalized); };
          var btn = document.createElement('button'); btn.type = 'button'; btn.className = 'src-open';
          btn.textContent = (normalized.field ? normalized.field + ': ' : '') + (normalized.value || src);
          btn.addEventListener('click', action);
          item.appendChild(btn);
        } else {
          var lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = src; item.appendChild(lbl);
          if (type !== 'Guideline') {
            var note = document.createElement('span'); note.className = 'src-note'; note.textContent = 'no document'; item.appendChild(note);
          }
          // No document to open; clicking an inline [n] for this source just highlights the Sources entry.
          action = function () { flashSource(item); };
        }
        return { el: item, action: action };
      }

      // Surface the patient's on-file source documents (from the payload) that the answer didn't cite inline,
      // grouped by document, so an ingested lab report is always discoverable even when the brief cited the
      // structured record instead of the document. reference: gitlab#122.
      function appendOnFileDocuments(keyEl, sources, docCitations) {
        if (!docCitations.length) return;
        var citedSlugs = {};
        sources.forEach(function (src) {
          if (src.indexOf('Document/') === 0) citedSlugs[src.slice('Document/'.length)] = true;
        });
        var citedDocs = {};
        docCitations.forEach(function (dc) {
          if (citedSlugs[String(pick(dc, 'FactId'))]) { var s = pick(dc, 'SourceDocumentId'); if (s) citedDocs[s] = true; }
        });
        var order = [], byDoc = {};
        docCitations.forEach(function (dc) {
          var sid = pick(dc, 'SourceDocumentId');
          if (!sid || citedDocs[sid]) return;
          if (!byDoc[sid]) { byDoc[sid] = []; order.push(sid); }
          byDoc[sid].push(dc);
        });
        if (!order.length) return;
        var sub = document.createElement('div'); sub.className = 'src-subhead'; sub.textContent = 'Source documents on file'; keyEl.appendChild(sub);
        order.forEach(function (sid) { keyEl.appendChild(renderOnFileDoc(byDoc[sid])); });
      }

      function renderOnFileDoc(facts) {
        var first = facts[0];
        var normalized = {
          sourceDocumentId: pick(first, 'SourceDocumentId'), field: pick(first, 'Field'),
          value: pick(first, 'Value'), page: pick(first, 'Page'), boundingBox: pick(first, 'BoundingBox'),
        };
        var item = document.createElement('div'); item.className = 'src-item';
        var badge = document.createElement('span'); badge.className = 'src-badge doc'; badge.textContent = 'Source document'; item.appendChild(badge);
        var btn = document.createElement('button'); btn.type = 'button'; btn.className = 'src-open';
        var summaries = [];
        for (var k = 0; k < facts.length && summaries.length < 3; k++) {
          var v = pick(facts[k], 'Value');
          if (v) { summaries.push(String(v).split(/\s+/).slice(0, 2).join(' ')); }
        }
        btn.textContent = (summaries.join(', ') || 'Open document') + (facts.length > 3 ? (' +' + (facts.length - 3) + ' more') : '');
        btn.addEventListener('click', function () { if (window.AgentForgeOverlay) window.AgentForgeOverlay.open(normalized); });
        item.appendChild(btn);
        return item;
      }

      // Render the answer text with each inline [n] as a clickable citation ref wired to citeActions[n]
      // (the same action as the Sources entry). Falls back to plain text for any number without an action.
      // reference: gitlab#129.
      function renderAnswerBody(container, text, citeActions) {
        var re = /\[(\d+)\]/g, last = 0, m;
        while ((m = re.exec(text)) !== null) {
          if (m.index > last) container.appendChild(document.createTextNode(text.slice(last, m.index)));
          var act = citeActions[parseInt(m[1], 10)];
          if (act) {
            var ref = document.createElement('button'); ref.type = 'button'; ref.className = 'cite-ref'; ref.textContent = m[0];
            ref.addEventListener('click', act);
            container.appendChild(ref);
          } else {
            container.appendChild(document.createTextNode(m[0]));
          }
          last = re.lastIndex;
        }
        if (last < text.length) container.appendChild(document.createTextNode(text.slice(last)));
      }

      // Scroll a Sources entry into view and briefly highlight it (used when an inline [n] has no openable doc).
      function flashSource(item) {
        if (!item) return;
        item.scrollIntoView({ block: 'nearest' });
        item.classList.add('cite-flash');
        setTimeout(function () { item.classList.remove('cite-flash'); }, 1100);
      }

      function renderAnswer(payload) {
        var m = document.createElement('div'); m.className = 'msg bot';
        var b = document.createElement('div'); b.className = 'bubble';

        if (pick(payload, 'IsDeterministicFallback')) {
          var banner = document.createElement('div'); banner.className = 'banner fallback';
          banner.textContent = 'Summary unavailable right now — showing source data, not a generated answer.';
          b.appendChild(banner);
        }

        var numbered = numberCitations(pick(payload, 'Answer') || '');
        var docCitations = pick(payload, 'DocumentCitations') || [];

        // Build the Sources list first so each inline [n] can reuse that source's action.
        var keyEl = null, citeActions = {};
        if (numbered.sources.length || docCitations.length) {
          keyEl = document.createElement('div'); keyEl.className = 'cite-key';
          var kh = document.createElement('div'); kh.className = 'h'; kh.textContent = 'Sources'; keyEl.appendChild(kh);
          numbered.sources.forEach(function (src, i) {
            var s = renderSource(i + 1, src, docCitations);
            keyEl.appendChild(s.el);
            citeActions[i + 1] = s.action;
          });
          appendOnFileDocuments(keyEl, numbered.sources, docCitations);
        }

        var ans = document.createElement('div'); ans.className = 'answer';
        renderAnswerBody(ans, numbered.text, citeActions);
        b.appendChild(ans);
        if (keyEl) b.appendChild(keyEl);

        var flags = pick(payload, 'SafetyFlags') || [];
        if (flags.length) {
          var fw = document.createElement('div'); fw.className = 'flags';
          flags.forEach(function (f) {
            var fl = document.createElement('div'); fl.className = 'flag';
            var desc = document.createElement('span'); desc.textContent = pick(f, 'Description') || pick(f, 'RuleId') || 'Safety flag';
            fl.appendChild(desc);
            var cites = pick(f, 'Citations') || [];
            if (cites.length) {
              var cw = document.createElement('span'); cw.className = 'cites';
              cites.forEach(function (c) { var s = document.createElement('span'); s.className = 'cite'; s.textContent = c; cw.appendChild(s); });
              fl.appendChild(cw);
            }
            fw.appendChild(fl);
          });
          b.appendChild(fw);
        }

        var suppressed = pick(payload, 'SuppressedClaims') || [];
        if (suppressed.length) {
          var det = document.createElement('details'); det.className = 'suppressed';
          var sum = document.createElement('summary');
          sum.textContent = suppressed.length + ' unsourced claim' + (suppressed.length > 1 ? 's' : '') + ' removed';
          det.appendChild(sum);
          var ul = document.createElement('ul');
          suppressed.forEach(function (s) {
            var li = document.createElement('li');
            li.textContent = '“' + (pick(s, 'Line') || '') + '” — ' + (pick(s, 'Reason') || 'no source');
            ul.appendChild(li);
          });
          det.appendChild(ul); b.appendChild(det);
        }

        m.appendChild(b); el('scroll').appendChild(m); scrollDown();
      }

      function handleMessage(msg) {
        var seq = pick(msg, 'Sequence');
        if (seq != null) { if (seen[seq]) return; seen[seq] = true; if (seq > lastSeq) lastSeq = seq; }
        var payloadJson = pick(msg, 'PayloadJson');
        var payload; try { payload = JSON.parse(payloadJson); } catch (e) { payload = { Answer: String(payloadJson || '') }; }
        clearThinking();
        renderAnswer(payload);
        setBusy(false);
      }

      // ---- turn control ----
      function setBusy(v) {
        busy = v;
        el('send').disabled = v || !conn || conn.state !== signalR.HubConnectionState.Connected;
        el('input').disabled = v;
        if (!v) el('input').focus();
      }
      function turnFailed(err) {
        clearThinking();
        var m = (err && err.message) || '';
        if (/No authenticated session/i.test(m)) { show('expired'); return; }
        var note = document.createElement('div'); note.className = 'msg bot';
        note.innerHTML = '<div class="bubble"><div class="banner fallback">That didn’t go through. Please try again.</div></div>';
        el('scroll').appendChild(note); scrollDown();
        setBusy(false);
      }
      function requestBrief() {
        if (briefRequested) return; briefRequested = true;
        setBusy(true); addThinking();
        conn.invoke('RequestBrief').catch(turnFailed);
      }
      function ask(text) {
        addUser(text); setBusy(true); addThinking();
        conn.invoke('AskFollowUp', text).catch(turnFailed);
      }

      // ---- connection ----
      function connect() {
        conn = new signalR.HubConnectionBuilder()
          .withUrl('hubs/chat', { withCredentials: true })
          .withAutomaticReconnect()
          .configureLogging(signalR.LogLevel.Warning)
          .build();

        conn.on('ChatMessage', handleMessage);
        conn.on('ChatStatus', function (status) { updateThinking(status); });
        conn.onreconnecting(function () { setStatus('wait', 'reconnecting…'); el('send').disabled = true; });
        conn.onreconnected(function () {
          setStatus('on', 'connected');
          // Replay anything delivered while we were gone rather than re-briefing.
          conn.invoke('Resume', lastSeq).then(function (msgs) { (msgs || []).forEach(handleMessage); }).catch(function () {});
          setBusy(busy);
        });
        conn.onclose(function () { setStatus('off', 'disconnected'); el('send').disabled = true; });

        setStatus('wait', 'connecting…');
        return conn.start().then(function () {
          setStatus('on', 'connected');
          setBusy(false);
          requestBrief();
        });
      }

      // ---- input wiring ----
      var input = el('input');
      input.addEventListener('input', function () { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; });
      el('composer').addEventListener('submit', function (e) {
        e.preventDefault();
        var text = input.value.trim();
        if (!text || busy) return;
        input.value = ''; input.style.height = 'auto';
        ask(text);
      });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); el('composer').requestSubmit(); }
      });
      el('fatal-retry').addEventListener('click', boot);

      function boot() {
        show('loading');
        briefRequested = false; lastSeq = 0; seen = {};
        loadPatient().then(function (d) {
          if (!d) return; // expired
          showChat();
          return connect();
        }).catch(function (err) {
          fatal('Couldn’t start the co-pilot', 'Couldn’t reach the AgentForge service (' + ((err && err.message) || 'connection error') + '). Please try again.');
        });
      }
      boot();
    })();
  </script>
</body>
</html>
