<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upload Document · AgentForge Clinical Co-Pilot</title>
  <style>
    :root {
      --bg: #f6f8fa; --surface: #ffffff; --border: #e3e8ee; --text: #1b2733;
      --muted: #5a6b7b; --accent: #1a6fb5; --accent-weak: #eaf3fb;
      --ok-bg: #e8f6ec; --ok-text: #1c6b34; --flag-bg: #fff4e5; --flag-text: #8a5300;
      --fail-bg: #fdecea; --fail-text: #9b2c22;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f151b; --surface: #182430; --border: #2a3a48; --text: #e6edf3;
        --muted: #93a4b3; --accent: #4aa3e0; --accent-weak: #14263a;
        --ok-bg: #16301f; --ok-text: #7fce97; --flag-bg: #3a2c14; --flag-text: #f0c079;
        --fail-bg: #3a1f1c; --fail-text: #f0a79c;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .lede { color: var(--muted); margin: 0 0 22px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    label { display: block; font-weight: 600; margin: 0 0 6px; }
    .field { margin-bottom: 18px; }
    select, input[type=file] { width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
    button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 11px 20px;
      font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .result { margin-top: 18px; border-radius: 8px; padding: 12px 14px; font-size: 14px; }
    .result.ok { background: var(--ok-bg); color: var(--ok-text); }
    .result.warn { background: var(--flag-bg); color: var(--flag-text); }
    .result.err { background: var(--fail-bg); color: var(--fail-text); }
    .result ul { margin: 6px 0 0; padding-left: 18px; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.5);
      border-top-color: #fff; border-radius: 50%; vertical-align: -3px; margin-right: 8px; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Upload a document</h1>
    <p class="lede">Attach a scanned lab result or intake form for the current patient. It is stored in the
      chart and its key values are extracted with source citations.</p>

    <form class="card" id="form">
      <div class="field">
        <label for="docType">Document type</label>
        <select id="docType" name="docType" required>
          <option value="lab_pdf">Lab result (PDF)</option>
          <option value="intake_form">Intake form</option>
        </select>
      </div>
      <div class="field">
        <label for="file">File</label>
        <input type="file" id="file" name="file" accept="application/pdf,image/*" required />
      </div>
      <button type="submit" id="submit">Upload</button>
      <div class="result" id="result" hidden></div>
    </form>
  </div>

  <script>
    (function () {
      var form = document.getElementById('form');
      var fileInput = document.getElementById('file');
      var docType = document.getElementById('docType');
      var submit = document.getElementById('submit');
      var result = document.getElementById('result');

      function showResult(kind, html) {
        result.className = 'result ' + kind;
        result.innerHTML = html;
        result.hidden = false;
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!fileInput.files || !fileInput.files.length) { return; }

        var body = new FormData();
        body.append('docType', docType.value);
        body.append('file', fileInput.files[0]);

        submit.disabled = true;
        submit.innerHTML = '<span class="spinner" aria-hidden="true"></span>Uploading…';
        result.hidden = true;

        // Relative to /agentforge/upload.html -> POST /agentforge/ingest/document; the session cookie
        // (set by the launch) carries the front-office user's token, so OpenEMR's ACL is the authority.
        fetch('ingest/document', { method: 'POST', body: body, credentials: 'same-origin' })
          .then(function (res) {
            return res.json().catch(function () { return null; }).then(function (data) { return { res: res, data: data }; });
          })
          .then(function (r) {
            var d = r.data || {};
            if (r.res.status === 401) {
              showResult('err', 'Your session expired. Please re-launch the upload page from OpenEMR and try again.');
              return;
            }
            if (r.res.ok) {
              var status = d.status === 'AlreadyIngested' ? 'Already on file' : 'Uploaded';
              var lines = '<strong>' + status + '.</strong><ul>'
                + '<li>' + (d.factCount || 0) + ' fact(s) extracted</li>'
                + '<li>' + (d.citationPending
                    ? 'Citation pending (document stored; reference not yet resolved)'
                    : 'Document reference: ' + (d.documentReferenceId || 'n/a')) + '</li></ul>';
              showResult(d.citationPending ? 'warn' : 'ok', lines);
              form.reset();
              return;
            }
            if (r.res.status === 422) {
              showResult('warn', 'The document could not be read into the required fields, so nothing was stored'
                + (d.detail ? ': ' + d.detail : '.') + ' Check the scan quality and document type, then retry.');
              return;
            }
            showResult('err', 'Upload failed (' + r.res.status + ')'
              + (d.detail ? ': ' + d.detail : '.') + ' If this persists, the account may lack document-write permission.');
          })
          .catch(function () {
            showResult('err', 'Couldn’t reach the upload service. Check your connection and try again.');
          })
          .then(function () {
            submit.disabled = false;
            submit.textContent = 'Upload';
          });
      });
    })();
  </script>
</body>
</html>
