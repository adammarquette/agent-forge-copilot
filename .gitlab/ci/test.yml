# -----------------------------------------------------------------------------
# TEST stage - unit tests (fully mocked). The integration suite (real OpenEMR) is
# defined here too but runs POST-DEPLOY in the `verify` stage (gitlab#70) so it can't
# gate the deploy - see its own header below. Both consume the build artifacts and run
# with --no-build.
#
# Results handling: every project writes into ONE shared results directory
# ($CI_PROJECT_DIR/TestResults) via --results-directory, and each logger uses
# LogFileName (relative to that directory) rather than LogFilePath. This avoids
# the default per-project / nested TestResults locations that the artifact globs
# would otherwise miss ("no matching files"). {assembly} keeps filenames unique
# across projects.
#
# Root cause of issue #21 (dotnet test silently ran zero tests, exit 0): the
# `build` job's artifacts (**/bin/, **/obj/) do NOT include the NuGet global
# packages cache (~/.nuget/packages) - it lives outside the repo checkout.
# Each test job starts a fresh container with an empty cache, so
# Microsoft.NET.Test.Sdk.props's `Condition="Exists(...)"` import silently
# fails to resolve, IsTestProject never gets set, and MSBuild's VSTest target
# (Condition="'$(IsTestProject)' == 'true'") is silently skipped - not an
# MTP-vs-VSTest runner-selection issue (global.json pinning VSTest explicitly
# did not fix it; confirmed against the real runner before settling on this).
# Fix: `dotnet restore` right before each `dotnet test --no-build` call
# repopulates the cache and regenerates props-import paths valid for this
# container; --no-build still skips the (already-done) compile step.
#
# Fail-safe guard, kept regardless: both jobs verify AFTER the loop that (a)
# at least one *.junit.xml was produced and (b) its combined tests="N" count
# is > 0, and fail loudly otherwise (NFR-REL-2 - a meaningful check, not an
# unconditional pass) - a second line of defense against this class of bug
# recurring for any other reason.
# -----------------------------------------------------------------------------

.test_template: &test_template
  stage: test
  needs: ["build"]
  artifacts:
    when: always
    paths:
      - TestResults/
    reports:
      junit: TestResults/*.junit.xml
    expire_in: 1 week

.verify_results: &verify_results |
  if ! ls TestResults/*.junit.xml >/dev/null 2>&1; then
    echo "No test result files were produced - dotnet test ran silently and produced nothing (issue #21). Failing rather than reporting a false green."
    exit 1
  fi
  total_tests=$(grep -ohE 'tests="[0-9]+"' TestResults/*.junit.xml | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
  if [ "$total_tests" -eq 0 ]; then
    echo "Test result files exist but report zero tests executed (issue #21). Failing rather than reporting a false green."
    exit 1
  fi
  echo "Verified: $total_tests test(s) actually executed."

unit-tests:
  <<: *test_template
  script:
    - |
      set -e
      projects=$(find . -type f -name "$UNIT_TEST_PATTERN" -not -path "*/bin/*" -not -path "*/obj/*")
      if [ -z "$projects" ]; then
        echo "No unit test projects matched '$UNIT_TEST_PATTERN'. Fix UNIT_TEST_PATTERN in .gitlab-ci.yml."
        exit 1
      fi
      for proj in $projects; do
        echo "dotnet restore $proj"
        dotnet restore "$proj"
        echo "dotnet test $proj"
        dotnet test "$proj" --no-build -c $BUILD_CONFIG \
          --results-directory "$CI_PROJECT_DIR/TestResults" \
          --logger "junit;LogFileName={assembly}.junit.xml" \
          --logger "trx;LogFileName={assembly}.trx"
      done
    - *verify_results

# The DETERMINISTIC eval rubrics (schema_valid / citation_present / no_phi_in_logs) run as xUnit theory
# tests - one result per golden case - in the standard dotnet-test flow, so an extraction/schema regression
# shows up as an ordinary red test. This is the hermetic half of the eval split: it never calls an LLM
# judge. The baseline/regression policy and the judge-bound rubrics stay in the console `evals` job
# (evals.yml). Single known project, so its path is referenced directly rather than globbed.
eval-tests:
  <<: *test_template
  script:
    - dotnet restore "tests/GauntletAI.AgentForge.EvalTests/GauntletAI.AgentForge.EvalTests.csproj"
    - |
      dotnet test "tests/GauntletAI.AgentForge.EvalTests/GauntletAI.AgentForge.EvalTests.csproj" --no-build -c $BUILD_CONFIG \
        --results-directory "$CI_PROJECT_DIR/TestResults" \
        --logger "junit;LogFileName={assembly}.junit.xml" \
        --logger "trx;LogFileName={assembly}.trx"
    - *verify_results

# Integration tests exercise the real deployed OpenEMR (FHIR/OAuth/SMART) in the
# single Railway "staging" environment - per ENGINEERING_STANDARDS.md §8.2 /
# tests/AGENTS.md, nothing here is mocked and there is no throwaway service container:
# the sidecar talks to OpenEMR only over FHIR (ARCHITECTURE.md - FHIR-first, no direct
# DB access in v1), so the target is a stable URL, not a fresh MySQL instance per run.
#
# Endpoint + OAuth client + test-fixture config is supplied via protected/masked GitLab
# CI/CD variables (Options-pattern env vars the fixtures read directly):
#   OpenEmrQa__BaseUrl, OpenEmrQa__Site, OpenEmrQa__TestPatientId,
#   OpenEmrQa__TestAccessToken, LlmQa__ApiKey, LlmQa__Model
# (see documentation/RAILWAY.md). The fixtures throw on startup if these are missing,
# which is intentional - a meaningful check, not an unconditional 200 (NFR-REL-2).
# OpenEmrQa__LoginUsername/LoginPassword (GitLab issue #30) are optional - only QA staff
# credentials, gating OpenEmrQaFixture's last-resort Playwright login self-heal.
#
# Placement (gitlab#70): this runs as a POST-DEPLOY, health-gated smoke test in the `verify`
# stage - deliberately downstream of `deploy`, so a transient OpenEMR outage (classically the fork
# redeploying mid-pipeline) can no longer veto the sidecar deploy. Deploy now gates only on build +
# unit-tests + evals, all sidecar-owned. The suite's own preflight (script below) waits for OpenEMR
# to report healthy and SKIPS with a distinct "dependency unavailable" signal if it never does, so
# an external outage no longer looks like 35 real assertion failures.
#
# The `rules` gate the job on OpenEmrQa__BaseUrl (until it's set the job isn't added, keeping the
# pipeline green) and on the default branch: because it `needs: [deploy]`, and deploy only runs on
# main, it is inherently main-only (post-merge, post-deploy). allow_failure stays true - a real
# regression here is a warning to investigate/roll back, not a merge/deploy blocker (the deploy has
# already gone out; a verify-stage failure means "fix forward or roll back", same as the /health +
# /ready smoke tests). Note: this drops the previous non-blocking MR-pipeline run - re-add a
# health-gated MR variant if pre-merge integration signal is wanted.
integration-tests:
  <<: *test_template
  stage: verify
  needs: ["build", "deploy"]
  rules:
    - if: '$OpenEmrQa__BaseUrl == null'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      allow_failure: true
  # Cache the downloaded browser binary (~180MB) across runs - it's pinned to the
  # Microsoft.Playwright package version below, so a version bump naturally busts it.
  cache:
    key: playwright-chromium-1.61.0
    paths:
      - .cache/ms-playwright/
  variables:
    PLAYWRIGHT_BROWSERS_PATH: $CI_PROJECT_DIR/.cache/ms-playwright
  script:
    - |
      set -e
      # Preflight (gitlab#70): wait for OpenEMR to actually be serving before running the suite.
      # The FHIR capability statement is unauthenticated (AUDIT.md §2.2 - metadata uses
      # SkipAuthorizationStrategy) and needs the whole FHIR/OAuth stack initialised, so a 2xx here
      # means the login page the Playwright fixture drives will render too. If OpenEMR never comes
      # up within the budget (e.g. the fork is mid-redeploy), SKIP the suite with a distinct signal
      # and exit 0 - an external-dependency outage must not masquerade as 35 assertion failures.
      health_url="${OpenEmrQa__BaseUrl}/apis/${OpenEmrQa__Site}/fhir/metadata"
      echo "Preflight: waiting for OpenEMR at ${health_url} ..."
      healthy=0
      for i in $(seq 1 24); do
        status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$health_url" || echo "000")
        if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
          echo "OpenEMR healthy (HTTP ${status}) after attempt ${i}."
          healthy=1
          break
        fi
        echo "  attempt ${i}: HTTP ${status}, OpenEMR not ready; retrying in 5s..."
        sleep 5
      done
      if [ "$healthy" -ne 1 ]; then
        echo "::: OpenEMR did not become healthy within the preflight budget - SKIPPING the integration suite."
        echo "::: This is an external-dependency-unavailable condition, NOT a sidecar test failure (gitlab#70)."
        exit 0
      fi
      # OpenEmrQaFixture's last-resort self-heal (GitLab issue #30) drives a real, headless
      # browser login when neither a refresh token nor a still-valid static token is
      # configured - install the browser binary it needs. Skipped when the login
      # credentials aren't set, since nothing would exercise that code path anyway.
      #
      # Runs Playwright's own bundled Node runtime + CLI directly - both ship inside the
      # Microsoft.Playwright NuGet package itself, so this needs nothing beyond the restore
      # below. Deliberately not playwright.ps1 (needs pwsh, absent from the base SDK image
      # and non-trivial to install reliably) or the dotnet global tool
      # Microsoft.Playwright.CLI (abandoned upstream - stuck at 1.2.3, no release matching
      # the library version pinned in Directory.Packages.props).
      if [ -n "$OpenEmrQa__LoginUsername" ]; then
        echo "dotnet restore $SOLUTION"
        dotnet restore "$SOLUTION"
        pw_dir="${NUGET_PACKAGES:-$HOME/.nuget/packages}/microsoft.playwright/1.61.0/.playwright"
        # Microsoft.Playwright's own MSBuild target (copying .playwright/ into each project's
        # build output) has proven non-deterministic in this pipeline - one run's build job
        # artifact had it, the very next run's didn't (891 vs 1043 files in **/bin/, same
        # commit), breaking OpenEmrQaFixture with "Driver not found" despite nothing having
        # changed. Copying it explicitly here, straight from the NuGet cache the restore above
        # just repopulated, makes this deterministic instead of hoping the build job's copy
        # step ran this time.
        dest_dir="tests/GauntletAI.AgentForge.IntegrationTests/bin/$BUILD_CONFIG/net10.0/.playwright"
        mkdir -p "$dest_dir"
        cp -r "$pw_dir"/. "$dest_dir"/
        echo "Installing Playwright's Chromium (for OpenEmrQaFixture's login self-heal)..."
        "$pw_dir/node/linux-x64/node" "$pw_dir/package/cli.js" install --with-deps chromium
      fi
      projects=$(find . -type f -name "$INTEGRATION_TEST_PATTERN" -not -path "*/bin/*" -not -path "*/obj/*")
      if [ -z "$projects" ]; then
        echo "No integration test projects matched '$INTEGRATION_TEST_PATTERN'. Fix INTEGRATION_TEST_PATTERN in .gitlab-ci.yml."
        exit 1
      fi
      for proj in $projects; do
        echo "dotnet restore $proj"
        dotnet restore "$proj"
        echo "dotnet test $proj"
        dotnet test "$proj" --no-build -c $BUILD_CONFIG \
          --results-directory "$CI_PROJECT_DIR/TestResults" \
          --logger "junit;LogFileName={assembly}.junit.xml" \
          --logger "trx;LogFileName={assembly}.trx"
      done
    - *verify_results
