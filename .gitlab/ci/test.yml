# -----------------------------------------------------------------------------
# TEST stage - unit tests (fully mocked) + integration tests (real QA OpenEMR).
# Both consume the build artifacts and run with --no-build.
# -----------------------------------------------------------------------------

.test_template: &test_template
  stage: test
  needs: ["build"]
  artifacts:
    when: always
    paths:
      - "**/TestResults/*.trx"
      - "**/TestResults/*.junit.xml"
    reports:
      junit: "**/TestResults/*.junit.xml"
    expire_in: 1 week

unit-tests:
  <<: *test_template
  script:
    - |
      set -e
      projects=$(find . -type f -name "$UNIT_TEST_PATTERN" -not -path "*/bin/*" -not -path "*/obj/*")
      if [ -z "$projects" ]; then
        echo "No unit test projects matched '$UNIT_TEST_PATTERN'. Fix UNIT_TEST_PATTERN in .gitlab-ci.yml."
        exit 1
      fi
      for proj in $projects; do
        echo "dotnet test $proj"
        dotnet test "$proj" --no-build -c $BUILD_CONFIG \
          --logger trx \
          --logger "junit;LogFilePath=TestResults/{assembly}.junit.xml"
      done

# Integration tests exercise a real deployed OpenEMR (FHIR/OAuth/SMART) in the QA
# environment - per ENGINEERING_STANDARDS.md §8.2 / tests/AGENTS.md, nothing here is
# mocked and there is no throwaway service container: the sidecar talks to OpenEMR only
# over FHIR (ARCHITECTURE.md - FHIR-first, no direct DB access in v1), so the target is
# a stable QA URL, not a fresh MySQL instance spun up per pipeline run.
#
# QA endpoint + OAuth client configuration is supplied via protected/masked GitLab
# CI/CD variables (Options-pattern env vars, e.g. OpenEmr__BaseUrl, OpenEmr__Site,
# OpenEmr__OAuth__ClientId) once Epic 2 (OpenEMR Integration: Auth & FHIR Client) lands
# and a QA deployment exists. Until then this job runs against whatever integration
# tests exist and is expected to fail loudly rather than silently pass, per
# NFR-REL-2's "meaningful check, not an unconditional 200" philosophy.
integration-tests:
  <<: *test_template
  script:
    - |
      set -e
      projects=$(find . -type f -name "$INTEGRATION_TEST_PATTERN" -not -path "*/bin/*" -not -path "*/obj/*")
      if [ -z "$projects" ]; then
        echo "No integration test projects matched '$INTEGRATION_TEST_PATTERN'. Fix INTEGRATION_TEST_PATTERN in .gitlab-ci.yml."
        exit 1
      fi
      for proj in $projects; do
        echo "dotnet test $proj"
        dotnet test "$proj" --no-build -c $BUILD_CONFIG \
          --logger trx \
          --logger "junit;LogFilePath=TestResults/{assembly}.junit.xml"
      done
