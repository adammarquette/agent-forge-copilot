# -----------------------------------------------------------------------------
# TEST stage - unit tests (fully mocked) + integration tests (real OpenEMR).
# Both consume the build artifacts and run with --no-build.
#
# Results handling: every project writes into ONE shared results directory
# ($CI_PROJECT_DIR/TestResults) via --results-directory, and each logger uses
# LogFileName (relative to that directory) rather than LogFilePath. This avoids
# the default per-project / nested TestResults locations that the artifact globs
# would otherwise miss ("no matching files"). {assembly} keeps filenames unique
# across projects.
# -----------------------------------------------------------------------------

.test_template: &test_template
  stage: test
  needs: ["build"]
  artifacts:
    when: always
    paths:
      - TestResults/
    reports:
      junit: TestResults/*.junit.xml
    expire_in: 1 week

unit-tests:
  <<: *test_template
  script:
    - |
      set -e
      projects=$(find . -type f -name "$UNIT_TEST_PATTERN" -not -path "*/bin/*" -not -path "*/obj/*")
      if [ -z "$projects" ]; then
        echo "No unit test projects matched '$UNIT_TEST_PATTERN'. Fix UNIT_TEST_PATTERN in .gitlab-ci.yml."
        exit 1
      fi
      for proj in $projects; do
        echo "dotnet test $proj"
        dotnet test "$proj" --no-build -c $BUILD_CONFIG \
          --results-directory "$CI_PROJECT_DIR/TestResults" \
          --logger "junit;LogFileName={assembly}.junit.xml" \
          --logger "trx;LogFileName={assembly}.trx"
      done

# Integration tests exercise the real deployed OpenEMR (FHIR/OAuth/SMART) in the
# single Railway "development" environment - per ENGINEERING_STANDARDS.md §8.2 /
# tests/AGENTS.md, nothing here is mocked and there is no throwaway service container:
# the sidecar talks to OpenEMR only over FHIR (ARCHITECTURE.md - FHIR-first, no direct
# DB access in v1), so the target is a stable URL, not a fresh MySQL instance per run.
#
# Endpoint + OAuth client + test-fixture config is supplied via protected/masked GitLab
# CI/CD variables (Options-pattern env vars the fixtures read directly):
#   OpenEmrQa__BaseUrl, OpenEmrQa__Site, OpenEmrQa__TestPatientId,
#   OpenEmrQa__TestAccessToken, LlmQa__ApiKey, LlmQa__Model
# (see documentation/RAILWAY.md). The fixtures throw on startup if these are missing,
# which is intentional - a meaningful check, not an unconditional 200 (NFR-REL-2).
#
# The `rules` below gate the job on OpenEmrQa__BaseUrl: until that variable is set the
# job is simply not added to the pipeline (keeping the pipeline green), and it activates
# automatically once the QA variables are configured. Set OpenEmrQa__BaseUrl last.
integration-tests:
  <<: *test_template
  rules:
    - if: '$OpenEmrQa__BaseUrl'
  script:
    - |
      set -e
      projects=$(find . -type f -name "$INTEGRATION_TEST_PATTERN" -not -path "*/bin/*" -not -path "*/obj/*")
      if [ -z "$projects" ]; then
        echo "No integration test projects matched '$INTEGRATION_TEST_PATTERN'. Fix INTEGRATION_TEST_PATTERN in .gitlab-ci.yml."
        exit 1
      fi
      for proj in $projects; do
        echo "dotnet test $proj"
        dotnet test "$proj" --no-build -c $BUILD_CONFIG \
          --results-directory "$CI_PROJECT_DIR/TestResults" \
          --logger "junit;LogFileName={assembly}.junit.xml" \
          --logger "trx;LogFileName={assembly}.trx"
      done
