# -----------------------------------------------------------------------------
# EVALS - the Week 2 eval-driven HARD GATE (Core Req 6). Runs the golden-set
# eval (deterministic, no database, no live API) and FAILS the pipeline when any
# rubric category drops below its threshold or regresses beyond the tolerance in
# evals/baseline.json. A red `evals` job blocks the MR - this is the PR-blocking
# "git hook equivalent". See evals/README.md and W2_ARCHITECTURE.md §8.
#
# Grading note: introducing a regression that weakens the extraction schema gate
# flips the schema_valid / safe_refusal cases and turns this job red (verified
# locally by injecting the regression and observing exit 1).
# -----------------------------------------------------------------------------
evals:
  stage: test
  needs: ["build"]
  script:
    # restore repopulates the NuGet cache in this fresh container (issue #21), then run the
    # golden-set gate; a non-zero exit code fails the job and blocks the merge.
    - dotnet restore "tools/GauntletAI.AgentForge.Evals/GauntletAI.AgentForge.Evals.csproj"
    - dotnet run --project "tools/GauntletAI.AgentForge.Evals" -c $BUILD_CONFIG -- evals
  artifacts:
    when: always
    paths:
      - evals/results.json
    expire_in: 1 week
