# -----------------------------------------------------------------------------
# DEPLOY stage — Railway deployment via `railway up`.
#
# Single-environment model: everything runs in the Railway "staging"
# environment (project lucid-clarity). Merges to main build and deploy the API
# there; integration tests run against that same environment's OpenEMR.
# (Previously "development" — that environment hit an unrecoverable deploy
# hang and was decommissioned 2026-07-10; "staging" is a fresh install and is
# now the sole environment going forward.)
#
# Railway has no native GitLab integration, so CI pushes code using the official
# CLI image, authenticated with an environment-scoped Railway *project token*
# supplied as a protected/masked GitLab CI variable:
#
#   RAILWAY_TOKEN_STAGING — project token scoped to the "staging" environment
#
# Create it in Railway: Project Settings > Tokens > New Token (pick the
# staging environment). Add it in GitLab: Settings > CI/CD > Variables
# (masked, protected). The token selects project + environment; --service picks
# the target service. Railway builds the repo's Dockerfile server-side.
#
# `railway up --ci` streams build logs and exits non-zero on build/deploy
# failure, so a red job means the deploy did not go out.
#
# Secrets live in exactly one place - GitLab CI/CD variables - and flow to
# Railway from here, not the other way around. `Llm__ApiKey` used to be set
# by hand directly on the Railway service, independent of anything in git or
# GitLab; it drifted out of sync with LlmQa__ApiKey (both meant to hold a real
# Anthropic key), landed on an invalid value, and every SMART launch's LLM
# call 401'd for a full session before the mismatch was found (nothing surfaced
# it sooner because the deterministic fallback path returns a normal-looking
# "success" - see AgentOrchestrator's fallback doc comment). Setting it here,
# from the same GitLab variable an operator actually edits, means there is one
# source of truth and every deploy re-asserts it - a bad manual edit in the
# Railway dashboard self-heals on the next push to main instead of silently
# persisting. Add further Railway secrets the same way as they come up, rather
# than back in the dashboard.
# -----------------------------------------------------------------------------

deploy:
  stage: deploy
  image:
    name: ghcr.io/railwayapp/cli:latest
    entrypoint: [""]
  interruptible: false
  variables:
    GIT_DEPTH: "1"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  environment:
    name: staging
    url: https://agent-forge-api-staging-staging.up.railway.app
  before_script:
    - railway --version
  script:
    - export RAILWAY_TOKEN="$RAILWAY_TOKEN_STAGING"
    - railway variable set "Llm__ApiKey=$Llm__ApiKey" --service agent-forge-api-staging
    # reference: gitlab#67 - re-assert the reverse-proxy-aware host/path config, the SMART OAuth
    # clients, and their scopes on every deploy so a rebuild or fresh service reproduces the working
    # launch - the same self-healing rationale as Llm__ApiKey above. Every host MUST be the reverse-
    # proxy front door, never a service's own Railway host: OpenEmr__BaseUrl != OpenEMR's
    # site_addr_oath fails with an aud mismatch, and a launch whose /launch and /callback land on
    # different hosts loses the session cookie ("No pending SMART launch"). Client secrets come from
    # masked GitLab CI variables; ids/hosts/scopes are non-secret. NOT re-asserted here (cannot be
    # Railway config-as-code): the /keys DataProtection volume and the OpenEMR-side module Launch
    # URI/Issuer + EHR-launch-skip settings - see documentation/RAILWAY.md.
    - PROXY="https://agent-forge-reverse-proxy-staging.up.railway.app"
    - railway variable set "OpenEmr__BaseUrl=$PROXY" --service agent-forge-api-staging
    - railway variable set "Bff__PublicBaseUrl=$PROXY/agentforge" --service agent-forge-api-staging
    - railway variable set "Bff__PathBase=/agentforge" --service agent-forge-api-staging
    - railway variable set "DataProtection__KeyRingPath=/keys" --service agent-forge-api-staging
    - railway variable set "OpenEmr__ClientId=$OpenEmr__ClientId" --service agent-forge-api-staging
    - railway variable set "OpenEmr__ClientSecret=$OpenEmr__ClientSecret" --service agent-forge-api-staging
    - railway variable set "OPenEmrAgenda__ClientId=$OPenEmrAgenda__ClientId" --service agent-forge-api-staging
    - railway variable set "OpenEmrAgenda__ClientSecret=$OpenEmrAgenda__ClientSecret" --service agent-forge-api-staging
    # Scopes as contiguous 0-based lists (a gap would truncate the bound array at the first missing
    # index). Patient launch (single-patient) then roster/agenda.
    # api:oemr grants the standard REST API for the E2 document write-back (POST /api/patient/:pid/document).
    # Requesting it here is necessary but NOT sufficient: the OAuth client must ALSO be registered with
    # api:oemr (finalizeScopes silently drops unregistered scopes) and the acting front-office user needs the
    # patients:docs write ACL - both OpenEMR-side. reference: gitlab#81, documentation/RAILWAY.md
    - |
      i=0
      for s in openid fhirUser launch launch/patient api:fhir api:oemr patient/Patient.read patient/Encounter.read patient/Observation.read patient/DocumentReference.read patient/Condition.read patient/AllergyIntolerance.read patient/MedicationRequest.read patient/Procedure.read patient/DiagnosticReport.read; do
        railway variable set "OpenEmr__Scopes__$i=$s" --service agent-forge-api-staging
        i=$((i+1))
      done
    # Roster/agenda uses user/ (not patient/) scopes: it reads ACROSS patients
    # (a /fhir/Condition?patient=<pid> search per roster row), which patient/
    # scopes forbid. Must cover every clinical resource the per-patient summary
    # reads, or that resource 401s ("scope user/<X>.s not in access token").
    - |
      i=0
      for s in openid fhirUser launch api:fhir user/Appointment.read user/Patient.read user/Encounter.read user/Observation.read user/DocumentReference.read user/Condition.read user/AllergyIntolerance.read user/MedicationRequest.read user/Procedure.read user/DiagnosticReport.read; do
        railway variable set "OpenEmrAgenda__Scopes__$i=$s" --service agent-forge-api-staging
        i=$((i+1))
      done
    - railway up --service agent-forge-api-staging --ci

# -----------------------------------------------------------------------------
# DEPLOY (reverse-proxy) — Railway deployment of reverse-proxy/'s nginx front
# door, via `railway up`.
#
# Deploys as a new sibling service in the SAME "staging" Railway environment
# (project lucid-clarity) the job above targets - not a separate, isolated
# environment. One deployment, not a duplicate: OpenEMR and the sidecar are
# already running there, so this just adds the front door alongside them
# rather than standing up a second parallel copy of the whole stack.
# RAILWAY_TOKEN_RP is a distinct GitLab CI variable but currently holds the
# same value as RAILWAY_TOKEN_STAGING for exactly that reason.
#
# Manual on purpose regardless: OpenEMR's own config (redirect_uri, launch
# URI, cookie_samesite - agent-forge#24/#25/#26) hasn't been updated to route
# through this proxy yet, and the launch/regression verification passes
# (agent-forge#28/#29) haven't run - this job existing doesn't mean traffic
# is ready to cut over to it.
#
# `RAILWAY_SERVICE_RP` already exists as a real Railway service (created
# 2026-07-12). `railway up` deploys TO an existing service, it doesn't create
# one - the first deploy attempt failed with "Service not found" before this
# service existed. Passing a subdirectory to `railway up` (e.g. `railway up
# reverse-proxy`) also fails here with "prefix not found" - a known Railway
# CLI issue in monorepos with more than one Dockerfile - so the build context
# stays the repo root and RAILWAY_DOCKERFILE_PATH points at the Dockerfile
# instead (see reverse-proxy/Dockerfile's own note).
# -----------------------------------------------------------------------------

nginx-deploy:
  stage: deploy
  image:
    name: ghcr.io/railwayapp/cli:latest
    entrypoint: [""]
  interruptible: false
  variables:
    GIT_DEPTH: "1"
    RAILWAY_SERVICE_RP: "agent-forge-reverse-proxy"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  environment:
    name: reverse-proxy
  before_script:
    - railway --version
  script:
    - export RAILWAY_TOKEN="$RAILWAY_TOKEN_RP"
    - railway variable set "RAILWAY_DOCKERFILE_PATH=/reverse-proxy/Dockerfile" --service "$RAILWAY_SERVICE_RP"
    - railway up --service "$RAILWAY_SERVICE_RP" --ci
