# -----------------------------------------------------------------------------
# CI — lint, build, test, evals, + publish the sidecar image to GHCR on release
# (merge to main). Ported from the retired GitLab pipeline
# (originals in git history at fbbf07d); see documentation/CI-SETUP.md.
#
# The lint/build/test/evals gates run with NO secrets. The `publish-image` job
# (bottom of this file) builds the sidecar once and pushes it to GHCR using the
# built-in GITHUB_TOKEN - still no repo secret. There is no deploy job in THIS
# file, but merging does deploy: railway-config.yml applies .railway/** on merge
# and the proxy rebuilds from the develop branch, so a proxy change reaches the
# live front door with no operator step. The sidecar is pinned to an image tag,
# so promoting a sidecar build is still a deliberate re-pin
# (documentation/DEPLOYMENT.md section 9).
#
# Three things changed shape in the port rather than being copied across:
#
#  1. No merge-with-target preamble. The GitLab pipeline ran a `git fetch` +
#     `git merge` of the MR target branch in a global before_script so that a
#     pipeline tested "your changes + current target", not a stale snapshot.
#     Actions gives this for free: a `pull_request` run checks out the MERGE
#     COMMIT (refs/pull/N/merge), and GitHub blocks the PR outright when that
#     merge is conflicted. The preamble - and the GIT_DEPTH tuning that existed
#     only to make its merge-base lookup work - is gone.
#
#  2. No cross-job build artifact. GitLab passed **/bin/ + **/obj/ from `build`
#     to the test jobs so they could use --no-build. That artifact could not
#     carry the NuGet global packages cache (it lives outside the checkout),
#     which is the root cause of the false-green in legacy issue #21 and forced a
#     `dotnet restore` before every --no-build test anyway. It also dragged in
#     ~100MB Playwright driver copies that had to be excluded by hand to stay
#     under the artifact size limit. Uploading tens of thousands of small files
#     through Actions' artifact API is slow and loses the executable bit, so each
#     job restores and builds in its own container instead, with the NuGet cache
#     shared via actions/cache. That deletes the whole bug class.
#
#  3. No native JUnit report. GitLab rendered `reports: junit` inline in the MR.
#     Actions has no equivalent, so .github/scripts/verify-test-results.sh writes
#     the counts to the job summary and the raw XML is uploaded as an artifact.
#     Deliberately not a third-party reporter action - that would be a supply-chain
#     dependency on every CI run for cosmetics.
# -----------------------------------------------------------------------------

name: CI

# `develop` is listed alongside `main` because it is the sole integration branch and is
# protected: without a push trigger the commit that actually lands on `develop` is never
# verified on its own. A PR run tests the merge preview, but this repo allows SQUASH merges,
# and a squashed commit is a new object that never existed when the PR ran - "require branches
# to be up to date" does not close that gap. It also means a direct push to a protected
# `develop` could never acquire the required checks at all.
#
# Note this is an explicit branch LIST, not a catch-all. The retired GitLab pipeline
# deliberately had no bare `$CI_COMMIT_BRANCH` rule (legacy issue #40): every branch here gets
# a PR opened right after its first push, so a catch-all ran the same commits twice - once on
# the raw branch ref, once on the MR pipeline. Naming only the integration branches keeps that
# fixed: feature branches still run via `pull_request` alone. Do not widen this to all branches.
on:
  pull_request:
  push:
    branches: [main, develop]

# = GitLab's `interruptible: true`. Superseded runs on the same ref are cancelled; the
# integration branches are excluded so every merge produces one complete, attributable run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

env:
  SOLUTION: AgentForge.slnx
  BUILD_CONFIG: Release
  UNIT_TEST_PATTERN: "*UnitTests.csproj"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  # ---------------------------------------------------------------------------
  # LINT — style/format gate + third-party license gate
  # (ENGINEERING_STANDARDS.md §10). Runs alongside build so a style or license
  # violation surfaces without waiting on the test matrix.
  # ---------------------------------------------------------------------------
  format:
    name: format
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: dotnet format --verify-no-changes
        run: dotnet format "$SOLUTION" --verify-no-changes

  # Fails the run if any dependency (direct or transitive) resolves to a license outside
  # .github/licenses/allowed-licenses.json - catches a restrictive-license bump before it
  # merges (ENGINEERING_STANDARDS.md §2, the FluentAssertions v8 commercial-license note).
  #
  # --use-project-assets-json reads the resolved project.assets.json. Central Package
  # Management leaves PackageReference elements without a Version attribute, which the tool
  # cannot resolve from the csproj alone, so this restores first to populate it.
  #
  # license-packages-filter.json narrowly exempts xunit.abstractions: it is genuinely
  # Apache-2.0 (same as the rest of the xunit project) but its NuGet package metadata has no
  # machine-readable license tag, only a LicenseUrl - a known metadata gap, not a license
  # risk. Extend that file only for the same kind of verified false positive.
  #
  # The scanner is pinned via the tool manifest (.config/dotnet-tools.json), NOT installed
  # latest-wins. An unpinned `dotnet tool install` makes this gate non-deterministic: a new
  # upstream release can change detection behaviour or break the job with no change in this
  # repo, and it is an unpinned dependency fetched on every run. 3.0.0-alpha is already
  # published, so "latest stable" is one release away from a major bump. The manifest keeps
  # CI and local runs on the same version and makes the pin reviewable in source.
  license-scan:
    name: license-scan
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore (populates project.assets.json for the scanner)
        run: dotnet restore "$SOLUTION"
      - name: Restore pinned tools
        run: dotnet tool restore
      - name: Scan licenses
        env:
          DOTNET_ROLL_FORWARD: LatestMajor
        run: |
          dotnet tool run dotnet-project-licenses -- -i . --use-project-assets-json -t \
            --allowed-license-types .github/licenses/allowed-licenses.json \
            --packages-filter .github/licenses/license-packages-filter.json \
            --json --outfile licenses-report.json -l Warning
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: licenses-report
          path: licenses-report.json
          retention-days: 7

  # The routing tables price every document they route to, so a reader sees the cost before paying it. That
  # column is a claim a document makes about itself, and nothing in an ordinary change has a reason to look
  # at it - so it goes stale, and a stale price sends readers the wrong way while looking authoritative.
  # scripts/check-doc-sizes.sh measures the files and fails on drift. It needs no toolchain.
  doc-sizes:
    name: doc-sizes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Priced routing tables match their files
        run: bash scripts/check-doc-sizes.sh
      - name: The gate can still go red
        run: bash scripts/check-doc-sizes-selftest.sh
  # ---------------------------------------------------------------------------
  # DOCS-SYNC - companion to doc-sizes above. That job keeps the prices honest;
  # this one keeps the docs themselves from rotting behind the code (root
  # AGENTS.md, "Docs stay in sync with the code").
  #
  # It detects the ABSENCE of doc edits, never their correctness: touching one
  # doc turns it green even if three others now lie. It is the floor the
  # author-side rule stands on, not a substitute for reading the diff.
  #
  # PATHS is deliberately narrow - code whose behaviour/topology the wiki
  # documents. tests/ and .github/ are excluded so routine test and pipeline
  # churn does not train everyone to reach for the escape hatch.
  #
  # PR_BODY arrives as an env var and is never interpolated into the script as
  # an expression: the body is attacker-controlled text and would execute.
  # ---------------------------------------------------------------------------
  docs-sync:
    name: docs-sync
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check documentation/ against the change
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PATHS='^(src/|reverse-proxy/|docker-compose[.]yml|[.]env[.]example)'

          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          CODE=$(echo "$CHANGED" | grep -E "$PATHS" || true)
          DOCS=$(echo "$CHANGED" | grep -E '^documentation/' || true)

          if [ -z "$CODE" ]; then
            echo "No documented-code paths touched - nothing to check."
            exit 0
          fi

          if [ -n "$DOCS" ]; then
            echo "documentation/ updated alongside the code:"
            echo "$DOCS" | sed 's/^/  /'
            exit 0
          fi

          if echo "${PR_BODY:-}" | grep -qiE '^[[:space:]]*docs:[[:space:]]*n/a[[:space:]]*[-:][[:space:]]*[^[:space:]].{2,}'; then
            echo "Opt-out found in the PR body - accepted."
            exit 0
          fi

          echo "::error::Code changed but documentation/ did not, and the PR body has no opt-out."
          echo ""
          echo "Changed code:"
          echo "$CODE" | sed 's/^/  /'
          echo ""
          echo "Route via documentation/INDEX.md section 1 (doc -> what it owns) and section 2"
          echo "(code -> project -> spec), then update every doc this change invalidates, in THIS PR."
          echo ""
          echo "If genuinely nothing went stale, add a line to the PR body:"
          echo "    docs: n/a - <why nothing went stale>"
          exit 1
  # ---------------------------------------------------------------------------
  # VERDICT-SELFTEST - proves the verdict parser still accepts what the contract
  # promises and rejects the near-misses.
  #
  # It runs here because documentation/agents/code-reviewer.md and CI-SETUP.md
  # both cite this self-test as the thing keeping the parser honest - and until
  # this job existed, nothing ran it. Loosening the regex would have left the
  # pipeline green: a test that cannot fail, which this repo's own reviewer
  # contract calls a finding (gh#400).
  # ---------------------------------------------------------------------------
  verdict-selftest:
    name: verdict-selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verdict parser self-test
        run: bash .github/scripts/verdict-state-selftest.sh




  # Validates reverse-proxy/nginx.conf.template's syntax without needing real upstream hosts
  # or a running stack. `nginx -t` only checks the RENDERED config, so the template's
  # ${VAR} placeholders are substituted with placeholders first (envsubst, the same mechanism
  # nginx's docker-entrypoint uses at container start) - this never needs real upstream
  # hostnames, and needs no secrets.
  #
  # Runs nginx via `docker run` rather than as a job `container:`. nginx:1.27-alpine is
  # musl-based, and Actions injects its own glibc-built Node into container jobs to run
  # JS actions like actions/checkout - which fails on musl. Checking out on the host and
  # shelling into the image sidesteps that entirely.
  nginx-config-lint:
    name: nginx-config-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render template and validate
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e PORT=8080 \
            -e OPENEMR_UPSTREAM=openemr:80 \
            -e SIDECAR_UPSTREAM=agent-forge-api:8080 \
            -e DNS_RESOLVER=127.0.0.11 \
            -e RESOLVER_IPV6=off \
            nginx:1.27-alpine sh -c '
              envsubst "\$PORT \$OPENEMR_UPSTREAM \$SIDECAR_UPSTREAM \$DNS_RESOLVER \$RESOLVER_IPV6" \
                < reverse-proxy/nginx.conf.template > /etc/nginx/conf.d/default.conf
              nginx -t
            '

  # The OpenEMR fork submodule records which SOURCE the deployed image was built from; compose and
  # the Railway IaC record which IMAGE gets deployed. Two halves of one fact in three files - this
  # fails the build if they drift apart. No submodule checkout needed: the guard reads the gitlink.
  openemr-pin:
    name: openemr-pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Submodule and image pins agree
        run: sh tools/verify-openemr-pin.sh

  # ---------------------------------------------------------------------------
  # BUILD — compile gate. The test jobs below rebuild in their own containers
  # (see header note 2), so this does not hand anything downstream; it exists so
  # a compile error surfaces as ONE red job instead of three, and so the NuGet
  # cache is warm by the time the test jobs start.
  # ---------------------------------------------------------------------------
  build:
    name: build
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore "$SOLUTION"
      - name: Build
        run: dotnet build "$SOLUTION" --no-restore -c "$BUILD_CONFIG"

  # ---------------------------------------------------------------------------
  # TEST — unit tests (fully mocked) and the deterministic eval rubrics.
  #
  # The integration suite is NOT here: it runs post-deploy against the real
  # OpenEMR and is part of the deploy/verify half still to be ported.
  #
  # Results handling: every project writes into ONE shared results directory via
  # --results-directory, and each logger uses LogFileName (relative to it) rather
  # than LogFilePath, so the artifact glob cannot miss nested per-project
  # TestResults locations. {assembly} keeps filenames unique across projects.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Run unit tests
        run: |
          set -e
          projects=$(find . -type f -name "$UNIT_TEST_PATTERN" -not -path "*/bin/*" -not -path "*/obj/*")
          if [ -z "$projects" ]; then
            echo "No unit test projects matched '$UNIT_TEST_PATTERN'. Fix UNIT_TEST_PATTERN in .github/workflows/ci.yml."
            exit 1
          fi
          for proj in $projects; do
            echo "dotnet test $proj"
            dotnet test "$proj" -c "$BUILD_CONFIG" \
              --results-directory "$GITHUB_WORKSPACE/TestResults" \
              --logger "junit;LogFileName={assembly}.junit.xml" \
              --logger "trx;LogFileName={assembly}.trx"
          done
      - name: Verify tests actually ran
        if: always()
        run: bash .github/scripts/verify-test-results.sh TestResults
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-unit
          path: TestResults/
          retention-days: 7

  # The DETERMINISTIC eval rubrics (schema_valid / citation_present / no_phi_in_logs) run as
  # xUnit theory tests - one result per golden case - so an extraction/schema regression shows
  # up as an ordinary red test. This is the hermetic half of the eval split: it never calls an
  # LLM judge. The baseline/regression policy and the judge-bound rubrics stay in the `evals`
  # job below. Single known project, so its path is referenced directly rather than globbed.
  eval-tests:
    name: eval-tests
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Run eval tests
        run: |
          dotnet test "tests/AgentForge.EvalTests/AgentForge.EvalTests.csproj" \
            -c "$BUILD_CONFIG" \
            --results-directory "$GITHUB_WORKSPACE/TestResults" \
            --logger "junit;LogFileName={assembly}.junit.xml" \
            --logger "trx;LogFileName={assembly}.trx"
      - name: Verify tests actually ran
        if: always()
        run: bash .github/scripts/verify-test-results.sh TestResults
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-eval
          path: TestResults/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # EVALS — the Week 2 eval-driven HARD GATE (Core Req 6). Runs the golden-set
  # eval (deterministic, no database, no live API) and FAILS the run when any
  # rubric category drops below its threshold or regresses beyond the tolerance
  # in evals/baseline.json. A red `evals` job blocks the PR - this is the
  # PR-blocking "git hook equivalent". See evals/README.md and
  # W2_ARCHITECTURE.md §8.
  # ---------------------------------------------------------------------------
  evals:
    name: evals
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Run golden-set eval gate
        run: dotnet run --project "tests/AgentForge.Evals" -c "$BUILD_CONFIG" -- evals
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: evals/results.json
          retention-days: 7
  # ---------------------------------------------------------------------------
  # REVIEW-VERDICT - the reviewer's ruling, as a gate (reference: gh#399).
  #
  # `needs` is the point: nobody is asked to rule on a diff that does not compile,
  # so this only starts once build and the test jobs are green. It then WAITS for a
  # verdict rather than failing for the lack of one - a PR with no ruling yet is
  # unreviewed, not rejected.
  #
  # What counts is defined once, in .github/scripts/verdict-state.sh, and is a
  # REVIEW body whose first line reads `**Verdict: Approve**` or
  # `**Verdict: Request changes**`. A PR comment carrying that line, or an inline
  # comment (whose review body is empty), is visible to a human and invisible here.
  #
  # DEADLINE is deliberately SHORT (5m) while this is bedding in: until reviews are
  # routine, a 30m wait would tax every PR with runner time and a standing red check,
  # and a red check nobody acts on stops meaning anything. Raise it once a reviewer is
  # reliably ruling - the signal is the same either way, only the patience differs.
  #
  # Request changes ends the wait immediately: only a push can resolve it.
  # An approval binds to the PR's CONTRIBUTION, not the head sha, so a target-sync or a
  # non-force rebase keeps it while a new commit, a conflict resolution or a force-push
  # kills it - see verdict-state.sh.
  # ---------------------------------------------------------------------------
  review-verdict:
    name: review-verdict
    runs-on: ubuntu-latest
    needs: [build, unit-tests, eval-tests, evals]
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # patch-id over the PR's contribution needs the real history.
          fetch-depth: 0
      - name: Wait for a verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          DEADLINE=$(( $(date +%s) + 5*60 ))
          while :; do
            out=$(bash .github/scripts/verdict-state.sh "$PR_NUMBER" 2>&1) || true
            echo "review-verdict: $out"
            # Switch on STATE, never on VERDICT alone: a GitHub review is permanent, so an old
            # `request-changes` stays readable forever and matching it would reject the very push
            # meant to clear it. STATE folds freshness in (gh#400).
            case "$out" in
              *STATE=approved*)
                echo "review-verdict: a fresh approval stands."
                exit 0 ;;
              *STATE=changes-requested*)
                echo "::error::Changes requested on the current contribution. Only a push can resolve this."
                exit 1 ;;
              *STATE=stale*)
                : ;;  # a ruling exists but predates this contribution - keep waiting for a re-review
            esac
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::No fresh verdict after 5 minutes (last read: $out)."
              echo "A verdict is a REVIEW body whose first line is '**Verdict: Approve**' or"
              echo "'**Verdict: Request changes**'. A PR comment or an inline comment does not count."
              echo "Post with: .github/scripts/post-verdict.sh review $PR_NUMBER COMMENT <body-file>"
              exit 1
            fi
            sleep 30
          done



  # ---------------------------------------------------------------------------
  # PUBLISH-IMAGE — build the sidecar once and push it to GHCR, so a deployment
  # pulls a pre-built, CI-verified image instead of rebuilding from source
  # (documentation/DEPLOYMENT.md §5). "Build once, deploy that exact artifact."
  #
  # ON MERGE TO main ONLY. In this repo main IS the release: develop is the sole
  # integration branch, staging takes develop-only, main takes staging-only
  # (human-promoted, single-source). So a push to main is the release event, and
  # the published image == the deployed image == the released state. develop
  # pushes and PRs run the gates above but do NOT publish.
  #
  # Gated on the full test matrix (needs: unit-tests, eval-tests, evals - build
  # is their transitive dep), so a red suite never publishes a deployable image.
  #
  # Uses the built-in GITHUB_TOKEN (packages: write) - no secret to manage. The
  # image carries NO secrets; runtime config comes from the environment at deploy
  # time (documentation/DEPLOYMENT.md §3).
  #
  # FIRST-PUBLISH console step: a new GHCR package is PRIVATE; flip it to public
  # (Settings -> Packages -> agent-forge-copilot -> Change visibility) so anyone
  # can pull it without a credential.
  # ---------------------------------------------------------------------------
  publish-image:
    name: publish-image
    runs-on: ubuntu-latest
    needs: [unit-tests, eval-tests, evals]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build to the local daemon first (single-platform; the deploy target is
      # amd64), so the verify below runs against the exact image that will be
      # pushed. The push step re-runs from the gha cache, so it is a cache hit,
      # not a second full build.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}:ci-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sanity-check the built image is the runnable sidecar before publishing -
      # cheaper than discovering a broken publish at deploy time. Not a full boot
      # (the app's ValidateOnStart needs OpenEmr/Llm config it must not carry), so
      # this asserts the published entrypoint assembly is present in the runtime layer.
      - name: Verify the image is the sidecar
        run: |
          set -euo pipefail
          if docker run --rm --entrypoint sh "${IMAGE}:ci-candidate" -c "test -f /app/AgentForge.Api.dll"; then
            echo "OK: AgentForge.Api.dll present in the runtime image."
          else
            echo "::error::Built image is missing the sidecar entrypoint assembly; refusing to publish."
            exit 1
          fi

      - name: Compute tags
        id: tags
        run: echo "sha=sha-$(echo "${GITHUB_SHA}" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ steps.tags.outputs.sha }}
          cache-from: type=gha

      - name: Summary
        run: |
          {
            echo "### Sidecar image published"
            echo ""
            echo '```'
            echo "docker pull ${IMAGE}:${{ steps.tags.outputs.sha }}"
            echo '```'
            echo ""
            echo "| Tag | |"
            echo "|---|---|"
            echo "| \`latest\` / \`main\` | move with main |"
            echo "| \`${{ steps.tags.outputs.sha }}\` | immutable — pin a deployment to this |"
          } >> "$GITHUB_STEP_SUMMARY"
