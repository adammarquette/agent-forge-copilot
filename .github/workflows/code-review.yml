# -----------------------------------------------------------------------------
# CODE REVIEW - the automated Code Reviewer, on every pull request.
#
# Ported from the retired GitLab pipeline (reference: gh#395). Separate from
# ci.yml on purpose: this is the only workflow that needs a model API key and
# write access to pull requests, and keeping that blast radius in one small file
# is easier to reason about than widening ci.yml's permissions.
#
# The review RULES are not here. The contract is documentation/agents/code-reviewer.md
# and the persona is .claude/agents/code-reviewer.md; this workflow only supplies
# the diff and carries the verdict. Review rules keep one home.
#
# SETUP: ANTHROPIC_API_KEY as a repository secret. GITHUB_TOKEN is built in -
# unlike GitLab's CI_JOB_TOKEN it can comment, so no hand-managed PAT exists to
# rotate or leak.
# -----------------------------------------------------------------------------

name: Code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push supersedes the review in flight; do not pay for both.
# (= GitLab's `interruptible: true`.)
concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    name: code-review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Drafts are not ready to be reviewed. `ready_for_review` above is what
    # brings a draft back in once it is marked ready.
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
        with:
          # The reviewer needs the real merge base, not a shallow window.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/ci/review.sh
